
<!DOCTYPE html>

    <script>
      (function() {
        function isViteOrWsNoise(args) {
          try {
            if (!args) return false;
            for (let i = 0; i < args.length; i++) {
              const arg = args[i];
              if (!arg) continue;
              if (typeof arg === 'string') {
                if (arg.includes('[vite]') || 
                    arg.includes('WebSocket') || 
                    arg.includes('WebChannel') || 
                    arg.includes('failed to connect to websocket') || 
                    arg.includes('transport errored') ||
                    arg.includes('server connection lost')) {
                  return true;
                }
              } else if (typeof arg === 'object') {
                const msg = (arg.message || '') + ' ' + (arg.reason || '') + ' ' + (arg.stack || '') + ' ' + (arg.name || '');
                if (msg.includes('[vite]') || 
                    msg.includes('WebSocket') || 
                    msg.includes('WebChannel') || 
                    msg.includes('failed to connect to websocket') || 
                    msg.includes('transport errored') ||
                    msg.includes('server connection lost')) {
                  return true;
                }
              }
            }
          } catch (e) {}
          return false;
        }

        let activeError = console.error;
        try {
          Object.defineProperty(console, 'error', {
            configurable: true,
            enumerable: true,
            get() {
              return function(...args) {
                if (isViteOrWsNoise(args)) return;
                activeError.apply(console, args);
              };
            },
            set(fn) {
              activeError = fn;
            }
          });
        } catch (e) {
          console.error = function(...args) {
            if (isViteOrWsNoise(args)) return;
            activeError.apply(console, args);
          };
        }

        let activeWarn = console.warn;
        try {
          Object.defineProperty(console, 'warn', {
            configurable: true,
            enumerable: true,
            get() {
              return function(...args) {
                if (isViteOrWsNoise(args)) return;
                activeWarn.apply(console, args);
              };
            },
            set(fn) {
              activeWarn = fn;
            }
          });
        } catch (e) {
          console.warn = function(...args) {
            if (isViteOrWsNoise(args)) return;
            activeWarn.apply(console, args);
          };
        }

        const origInfo = console.info;
        const origLog = console.log;

        console.info = function(...args) {
          if (isViteOrWsNoise(args)) return;
          origInfo.apply(console, args);
        };
        console.log = function(...args) {
          if (isViteOrWsNoise(args)) return;
          origLog.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (isViteOrWsNoise([event.message, event.error, event.filename])) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteOrWsNoise([event.reason])) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <!--
      Both, deliberately. `mobile-web-app-capable` is the standard Chrome now
      asks for; `apple-mobile-web-app-capable` is the one iOS Safari still reads,
      and dropping it would stop the app opening full-screen when a client adds
      the portal to their home screen. Chrome only warns about the Apple tag when
      the standard one is missing, so having both silences it without giving up
      iOS.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <style>
      :root { color-scheme: light; }
      
      /* The house font is set once in src/typography.css and inherited.
         The font-choice classes below carry !important so a studio's chosen
         face still overrides it. */

      /* Global Font Selections.
         The exemption list matters: this rule sets font-family with !important
         on EVERY descendant, so any element that deliberately opts into a
         different face has to be excluded or the utility silently dies.
         .font-display and .font-serif are display choices in the same sense
         .font-mono already was. */
      /* Global Font Selections */
      body.font-choice-jakarta,
      body.font-choice-jakarta :not(.font-mono):not(.font-display):not(.font-serif):not(code):not(pre) { 
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif !important;
      }
      body.font-choice-opensans,
      body.font-choice-opensans :not(.font-mono):not(.font-display):not(.font-serif):not(code):not(pre) { 
        font-family: "Open Sans", system-ui, -apple-system, sans-serif !important;
      }
      body.font-choice-playfair,
      body.font-choice-playfair :not(.font-mono):not(.font-display):not(.font-serif):not(code):not(pre) { 
        font-family: "Playfair Display", Georgia, serif !important;
      }
      body.font-choice-system,
      body.font-choice-system :not(.font-mono):not(.font-display):not(.font-serif):not(code):not(pre) { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      }

      /* Vibrant Focus */

      details > summary { list-style: none; }
      details > summary::-webkit-details-marker { display: none; }

      /* "Milky White" Glass Theme */
      .glass-light {
        background: rgba(255, 255, 255, 0.85); /* Polished milky white with high-blur transparency */
        backdrop-filter: blur(20px) saturate(190%);
        -webkit-backdrop-filter: blur(20px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 
          0 8px 32px 0 rgba(31, 38, 135, 0.04),
          0 1px 2px 0 rgba(255, 255, 255, 0.8) inset;
      }
      
      /* Subtle Ambient Background - Pristine Milky White */
      body.app-shell {
        background-color: #F8FAFC !important; /* Uniform Milky White Canvas */
        background-image: none !important; /* Remove gradients for seamless clean canvas */
        background-attachment: fixed;
      }
      
/* The primary button, in the app's own indigo.

         It was a saturated Tailwind-blue gradient (#2563EB -> #1E40AF) while
         every other surface uses the Metallic Chic indigo, so it read as a
         foreign, shouting block. #3D52A0 on white clears 7:1, so the softer
         colour costs nothing in legibility. */
      .btn-primary {
        background: #3D52A0;
        color: white;
        transition: background .2s ease, box-shadow .2s ease;
      }
      .btn-primary:hover {
        background: #334486;
        box-shadow: 0 6px 16px -8px rgba(18, 24, 47, 0.45);
      }

      /* Clean Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
        border: 2px solid #ffffff; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      
      body.luxe-proposal-active {
          background-color: #ffffff !important;
          background-image: none !important;
          color: #1e3a8a !important;
      }
      
      @media print {
        @page { margin: 0.5cm; }
        
        html, body, #root, .app-shell {
          background: white !important;
          background-image: none !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        
        /* Hide all default UI elements */
        .no-print, 
        nav, 
        aside, 
        .vnext-header, 
        button,
        .fixed,
        .sticky { 
            display: none !important; 
        }

        /* Reset Main Container */
        main {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            max-width: none !important;
            overflow: visible !important;
            height: auto !important;
        }

        /* Proposal Container specific overrides */
        .proposal-container {
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            max-width: none !important;
            overflow: visible !important;
            height: auto !important;
            display: block !important;
        }

        /* Ensure content is visible */
        * {
            visibility: visible;
        }
        
        /* Force background printing for specific elements */
        .bg-slate-900 {
            background-color: #0f172a !important;
            color: white !important;
        }
        
        /* Page Break Rules */
        .page-break-before { page-break-before: always !important; }
        .page-break-after { page-break-after: always !important; }
        .break-inside-avoid { page-break-inside: avoid !important; }

        /* Professional PDF Pack Styling */
        .vnext-proposal-wrapper {
            background: white !important;
        }

        /* Force new page for major sections in print */
        @media print {
            #snapshot, #roomwise, #payments, #terms, #l2_fees, #l2_risk {
                page-break-before: always !important;
            }
            
            section {
                margin-bottom: 2rem !important;
                border: none !important;
                box-shadow: none !important;
                page-break-inside: avoid !important;
            }
            
            /* Ledger Style Polish */
            .ledger-row {
                display: flex !important;
                justify-content: space-between !important;
                border-bottom: 1px dashed #cbd5e1 !important;
                padding: 4pt 0 !important;
            }
            .ledger-total {
                background: #0f172a !important;
                color: white !important;
                padding: 10pt !important;
                margin-top: 10pt !important;
                -webkit-print-color-adjust: exact;
            }
        }

        .scan-first {
            margin-bottom: 2rem !important;
            display: block !important;
        }

        .scan-first summary {
            display: none !important;
        }

        .scan-first > div {
            display: block !important;
            opacity: 1 !important;
            transform: none !important;
        }

            border-collapse: collapse !important;

        }

                bottom: 0;
                left: 0;
                right: 0;
                height: 40px;
                border-top: 1px solid #e2e8f0;
                align-items: center;
                justify-content: space-between;

            }

            /* Force new page for major sections */
            .scan-first {

            }

            .scan-first:first-of-type {
                page-break-before: auto;
            }
        }
      }

      /* Wavy page note — the characters ripple, there is no underline. */
      .page-header-wave > span {
        display: inline-block;
        white-space: pre;
        animation: ph-wave-char 2.8s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes ph-wave-char {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-2.5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .page-header-wave > span { animation: none; }
      }

      /* ── Client portal ──────────────────────────────────────────────────
         Three effects the approved portal design leans on. Each runs once or
         is a slow ambient loop; nothing here re-animates on state change. */

      /* The halo on the spine's current node — a slow pulse outward, so the
         eye finds "you are here" without a label shouting it. */
      .portal-ping { animation: portal-ping 2.8s cubic-bezier(.22,.9,.28,1) infinite; }
      @keyframes portal-ping {
        0%   { opacity: .55; transform: scale(.85); }
        70%  { opacity: 0;   transform: scale(1.5); }
        100% { opacity: 0;   transform: scale(1.5); }
      }

      /* The Ask pill arrives rather than appearing — it tracks the pointer down
         a long contract, and a hard cut at each section reads as flicker. */
      .portal-ask-pill { animation: portal-ask-in .22s cubic-bezier(.22,.9,.28,1) both; }
      @keyframes portal-ask-in {
        from { opacity: 0; transform: translateY(4px) scale(.9); }
        to   { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .portal-ask-pill { animation: none; }
        .portal-ping { animation: none; }
        .portal-ping { opacity: 0; }
      }
    </style>
