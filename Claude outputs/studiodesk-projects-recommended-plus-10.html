<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheStudioDesk · Projects — recommended screen + 10 more concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* StudioDesk tokens (DESIGN.md): Plus Jakarta Sans, brand #3D52A0, slate neutrals, rose/amber/emerald for state,
   stage colours approved for the Projects screen only (lib/projectFolders.ts). No amounts on this screen. */
:root{
  --brand:#3D52A0; --brandH:#334486; --brandT:rgba(61,82,160,.10);
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b; --s900:#0f172a;
  --rose:#e11d48; --rose7:#be123c; --rose1:#ffe4e6; --amber7:#b45309; --amber1:#fef3c7; --gold:#B8923A; --em7:#047857; --em1:#d1fae5;
  --lead:#0284c7; --proposal:#3D52A0; --won:#B8923A; --execution:#c2410c; --completed:#047857; --lost:#64748b; --terminated:#be123c;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:none} *::-webkit-scrollbar{display:none}
html,body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--s800);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:170px!important;background:
  radial-gradient(1200px 600px at 10% -10%,rgba(61,82,160,.10),transparent 60%),
  radial-gradient(900px 500px at 100% 0%,rgba(148,163,184,.18),transparent 60%),
  radial-gradient(circle at 1px 1px,rgba(100,116,139,.16) 1px,transparent 0) 0 0/22px 22px,#f5f7fb;min-height:100vh;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
.tnum{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--s500)}
.meta{font-size:12px;color:var(--s500)}
.help{font-size:11px;color:var(--s500)}

/* ---------- top bar (as the app) ---------- */
.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--s200);display:flex;align-items:center;gap:4px;padding:10px 22px;overflow-x:auto}
.logo{font-size:10px;font-weight:800;letter-spacing:.12em;border:1.5px solid var(--s700);padding:4px 8px;border-radius:6px;margin-right:14px;white-space:nowrap;color:var(--s700)}
.tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;font-weight:600;font-size:14px;color:var(--s700);white-space:nowrap}
.tab svg{color:var(--s400)}
.tab.on{background:linear-gradient(180deg,#4d62b4,var(--brand));color:#fff;box-shadow:0 6px 16px -6px rgba(61,82,160,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.tab.on svg{color:#fff}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--s500);flex:none}
.ib:hover{background:var(--s100)}
.who{display:flex;align-items:center;gap:10px;margin-left:8px;white-space:nowrap}
.who b{font-size:14px}
.sa{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--brandT);padding:3px 9px;border-radius:99px}
.av{width:36px;height:36px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}

.wrap{max-width:1380px;margin:0 auto;padding:22px 24px 0}
.title{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid rgba(203,213,225,.7);margin-bottom:14px}
.title h1{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--s800)}
.search{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--s300);background:#fff;min-width:240px;margin-left:auto}
.search input{border:0;outline:0;width:100%;font-size:14px;background:none}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,82,160,.18)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s,transform .15s,box-shadow .15s}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{background:var(--brandH)}
.btn.s{border:1px solid var(--s300);background:#fff;color:var(--s700)}.btn.s:hover{background:var(--s50)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.block{background:var(--rose);color:#fff}.btn.block:hover{background:var(--rose7)}
.btn.due{background:var(--gold);color:#fff}.btn.due:hover{background:#a07d2e}
.btn.go{background:var(--brand);color:#fff}.btn.go:hover{background:var(--brandH)}
.btn:active{transform:translateY(1px)}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.strip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--s200);border-radius:16px;padding:7px 8px 7px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--s200);background:#fff;white-space:nowrap;transition:all .15s}
.bchip.r{color:var(--rose7);border-color:#fecdd3;background:#fff7f8}
.bchip.a{color:var(--amber7);border-color:#fde68a;background:#fffbeb}
.bchip.on{box-shadow:0 0 0 3px rgba(225,29,72,.15)}
.bchip.a.on{box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--s100);gap:2px}
.seg button{padding:5px 12px;border-radius:9px;font-size:12px;font-weight:700;color:var(--s500);transition:all .2s var(--ease)}
.seg button.on{background:#fff;color:var(--s800);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.stages{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;border-bottom:1px solid rgba(226,232,240,.7);margin-bottom:18px}
.stg{flex:none;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:12px;font-size:14px;font-weight:600;color:var(--s600);border:1px solid transparent;transition:all .2s var(--ease)}
.stg:hover{background:rgba(255,255,255,.8)}
.stg.on{background:#fff;border-color:var(--s200);color:var(--s800);box-shadow:0 4px 14px -6px rgba(15,23,42,.18)}
.stg i{width:10px;height:10px;border-radius:3px;display:block}
.stg .c{font-size:12px;color:var(--s400);font-weight:700}

/* ---------- shared pieces ---------- */
.panel{background:#fff;border:1px solid var(--s200);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.55));backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px -12px rgba(15,23,42,.25),inset 0 1px 0 rgba(255,255,255,.9)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chip.brand{background:var(--brandT);color:var(--brand)} .chip.slate{background:var(--s100);color:var(--s600)}
.chip.good{background:var(--em1);color:var(--em7)} .chip.warn{background:var(--amber1);color:var(--amber7)} .chip.bad{background:var(--rose1);color:var(--rose7)}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ph{position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.55),transparent 55%),
  linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,#fff),color-mix(in srgb,var(--c) 55%,#e2e8f0))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),opacity .4s}
.ph .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:color-mix(in srgb,var(--c) 70%,#1e293b);font-size:11px;font-weight:700}
.ph .none svg{opacity:.7}
.own{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:var(--brand);flex:none;border:2px solid #fff}
.more{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--s500);flex:none}
.more:hover{background:var(--s100);color:var(--s800)}
.journey{display:flex;gap:3px;align-items:center}
.journey i{height:5px;flex:1;border-radius:9px;background:var(--s200);display:block}
.journey i.f{background:var(--c)}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 1px 2px rgba(15,23,42,.12),inset 0 1px 0 rgba(255,255,255,.8);background:linear-gradient(180deg,#fff,#f1f5f9);color:var(--brand)}
.tag.dummy{color:var(--amber7);background:linear-gradient(180deg,#fffbeb,#fef3c7)}
.tag.untagged{color:var(--rose7);background:linear-gradient(180deg,#fff1f2,#ffe4e6)}
.seal{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;transform:rotate(3deg);background:linear-gradient(180deg,#fff,#eef2ff);color:var(--s600);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.seal.pg{background:linear-gradient(180deg,#5a6fc0,var(--brand));color:#fff}
.empty{padding:48px;text-align:center}
.empty b{display:block;font-size:16px;color:var(--s800);margin-bottom:4px}

/* motion (mirrors hud-panel-in / hud-row-in / phd-pop; all off under reduced motion) */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.35)}50%{box-shadow:0 0 0 6px rgba(225,29,72,0)}}
@keyframes travel{from{background-position:0 0}to{background-position:-200px 0}}
.rise{animation:rise .45s var(--ease) both}
.swap{animation:fadein .25s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 1 · Ledger ---------- */
.lg-h{display:grid;grid-template-columns:minmax(300px,2.4fr) 1.2fr 1fr 1.3fr 40px;gap:16px;padding:12px 20px;border-bottom:1px solid var(--s100)}
.lg-grp{display:flex;align-items:center;gap:8px;padding:14px 20px 8px;font-size:12px;font-weight:700;color:var(--s600)}
.lg-r{display:grid;grid-template-columns:minmax(300px,2.4fr) 1.2fr 1fr 1.3fr 40px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--s100);cursor:pointer;transition:background .15s;position:relative}
.lg-r:hover{background:var(--s50)}
.lg-r .th{width:64px;height:48px;border-radius:12px;flex:none}
.lg-r:hover .th img{transform:scale(1.08)}
.lg-p{display:flex;gap:14px;align-items:center;min-width:0}
.lg-p .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files{display:flex;gap:6px;margin-top:6px;max-height:0;opacity:0;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s}
.lg-r:hover .files{max-height:40px;opacity:1}
.file{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--s700);background:#fff;border:1px solid var(--s200);border-radius:8px;padding:3px 8px;white-space:nowrap;transition:all .15s}
.file:hover{border-color:var(--brand);color:var(--brand)}
.file svg{color:var(--s400)}

/* ---------- 2 · Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(120px,auto);gap:14px}
.bt{padding:18px;border-radius:20px;position:relative;overflow:hidden}
.bt h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.bt h3 .n{margin-left:auto;font-size:24px;font-weight:900;color:var(--s800)}
.bt-need{grid-column:span 5;grid-row:span 3;background:linear-gradient(160deg,#fff,#fff6f7)}
.bt-site{grid-column:span 7;grid-row:span 2}
.bt-a{grid-column:span 4}
.bt-hand{grid-column:span 7}
.bt-closed{grid-column:span 5}
.nrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--s100);cursor:pointer}
.nrow:first-of-type{border-top:0}
.nrow .th{width:44px;height:44px;border-radius:12px;flex:none}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:14px}
.sitecard{flex:0 0 200px;scroll-snap-align:start;cursor:pointer}
.sitecard .th{height:120px;border-radius:14px}
.sitecard:hover img{transform:scale(1.06)}
.mini{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--s100);cursor:pointer;font-size:14px;font-weight:600}
.mini:first-of-type{border-top:0}
.mini .th{width:34px;height:34px;border-radius:10px;flex:none}

/* ---------- 3 · Glass lanes ---------- */
.lanes{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;align-items:flex-start}
.lane{flex:0 0 268px;scroll-snap-align:start;border-radius:20px;padding:10px;min-height:420px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,rgba(255,255,255,.6)),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(10px);transition:box-shadow .2s}
.lane.over{box-shadow:0 0 0 2px var(--c) inset}
.lane-h{display:flex;align-items:center;gap:8px;padding:6px 6px 12px;font-weight:700;font-size:14px}
.lane-h .c{margin-left:auto;font-size:12px;color:var(--s500);background:#fff;border-radius:99px;padding:1px 9px}
.lcard{background:#fff;border:1px solid var(--s200);border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:grab;transition:transform .2s var(--ease),box-shadow .2s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(15,23,42,.25)}
.lcard.drag{opacity:.4}
.lcard .th{height:110px}
.lcard .b{padding:12px}

/* ---------- 4 · Studio index ---------- */
.idx{position:relative}
.ix-r{display:grid;grid-template-columns:56px 1fr 220px 150px 230px;gap:20px;align-items:center;padding:16px 4px;border-top:1px solid var(--s200);cursor:pointer;transition:opacity .3s,color .3s}
.ix-r:last-child{border-bottom:1px solid var(--s200)}
.ix-r .no{font-size:12px;font-weight:700;color:var(--s400)}
.ix-r .nm{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1;transition:transform .35s var(--ease),color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx.hov .ix-r{opacity:.35}
.idx.hov .ix-r.on{opacity:1}
.idx.hov .ix-r.on .nm{transform:translateX(12px);color:var(--c)}
.ix-r .mth{display:none;width:64px;height:48px;border-radius:12px}
.follow{position:fixed;left:0;top:0;width:340px;height:230px;border-radius:20px;pointer-events:none;z-index:40;opacity:0;transform:scale(.9);transition:opacity .25s,transform .35s var(--ease);box-shadow:0 30px 60px -20px rgba(15,23,42,.45)}
.follow.on{opacity:1;transform:scale(1)}
.follow .cap{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:700}

/* ---------- 5 · Cover flow ---------- */
.cf{position:relative;height:470px;perspective:1600px;overflow:hidden;touch-action:pan-y}
.cf-c{position:absolute;left:50%;top:20px;width:560px;height:380px;margin-left:-280px;border-radius:26px;transition:transform .6s var(--ease),opacity .5s,filter .5s;cursor:pointer;transform-style:preserve-3d}
.cf-c .th{position:absolute;inset:0;border-radius:26px;box-shadow:0 40px 70px -30px rgba(15,23,42,.5)}
.cf-c .plate{position:absolute;left:16px;right:16px;bottom:16px;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:opacity .4s}
.cf-c:not(.act) .plate{opacity:0}
.cf-c .refl{position:absolute;left:0;right:0;top:100%;height:80px;border-radius:26px;transform:scaleY(-1);opacity:.18;overflow:hidden;filter:blur(2px);-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%)}
.cf-nav{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:30;margin-top:-40px}
.cf-strip{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:6px 0}
.cf-dot{flex:none;width:56px;height:40px;border-radius:10px;opacity:.55;transition:all .3s var(--ease);outline:2px solid transparent;outline-offset:2px}
.cf-dot.on{opacity:1;outline-color:var(--brand);width:72px}

/* ---------- 6 · Wallet ---------- */
.wallets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 22px}
.wst h4{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:12px}
.wst h4 .c{color:var(--s400);font-size:12px}
.stack{position:relative;transition:height .45s var(--ease)}
.pass{position:absolute;left:0;right:0;height:232px;border-radius:22px;overflow:hidden;cursor:pointer;transition:top .45s var(--ease),transform .3s var(--ease),box-shadow .3s;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 75%,#0f172a));box-shadow:0 -1px 0 rgba(255,255,255,.4) inset,0 12px 28px -14px rgba(15,23,42,.45)}
.pass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none}
.stack:not(.exp) .pass:hover{transform:translateY(-8px)}
.pass .ph-h{display:flex;align-items:center;gap:10px;padding:14px 16px;height:56px}
.pass .ph-h b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass .ph-h span{margin-left:auto;font-size:11px;opacity:.85;white-space:nowrap}
.pass .pb{display:flex;gap:12px;padding:0 16px}
.pass .pb .th{width:120px;height:96px;border-radius:14px;flex:none;border:2px solid rgba(255,255,255,.4)}
.pass .pf{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:8px}
.pass .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pass .v{font-size:14px;font-weight:700}
.pass .btn{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pass .notch{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#f5f7fb;margin-top:-9px}

/* ---------- 7 · Journey line ---------- */
.jl{padding:26px 26px 18px;overflow-x:auto}
.jl-g{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));min-width:780px;position:relative}
.jl-tok{display:flex;flex-wrap:wrap-reverse;gap:8px;justify-content:center;align-content:flex-start;min-height:120px;padding:0 10px 18px}
.tok{width:46px;height:46px;border-radius:50%;position:relative;cursor:pointer;transition:transform .25s var(--ease);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c),0 8px 18px -8px rgba(15,23,42,.5)}
.tok .ph{width:100%;height:100%;border-radius:50%}
.tok:hover{transform:translateY(-4px) scale(1.08);z-index:3}
.tok .flag{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.tok .flag.block{background:var(--rose);animation:breathe 2s infinite}
.tok .flag.due{background:var(--gold)}
.jl-line{grid-column:1/-1;height:10px;border-radius:9px;margin:0 9%;background:linear-gradient(90deg,var(--lead),var(--proposal),var(--won),var(--execution),var(--completed));position:relative;overflow:hidden}
.jl-line::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.45) 60px 100px,transparent 100px 200px);animation:travel 3s linear infinite}
.jl-st{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:0;margin-top:-17px;cursor:pointer}
.jl-st .ring{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--c);transition:transform .25s var(--ease);position:relative;z-index:2}
.jl-st:hover .ring,.jl-st.on .ring{transform:scale(1.25)}
.jl-st b{font-size:14px;font-weight:700}
.jl-st.on b{color:var(--c)}
.siding{display:flex;align-items:center;gap:12px;margin:22px 0 0;padding:12px 16px;border-radius:14px;background:var(--s50);border:1px dashed var(--s300)}

/* ---------- 8 · Spotlight + shelves ---------- */
.spot{display:grid;grid-template-columns:1.55fr 1fr;border-radius:26px;overflow:hidden;min-height:340px;margin-bottom:26px;position:relative}
.spot .th{min-height:340px}
.spot .side{padding:28px;display:flex;flex-direction:column;gap:10px;background:#fff}
.spot h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.spdots{display:flex;gap:6px;margin-top:auto}
.spdots button{width:26px;height:6px;border-radius:9px;background:var(--s200);transition:all .3s var(--ease)}
.spdots button.on{width:44px;background:var(--brand)}
.shelf{margin-bottom:24px}
.shelf-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shelf-h h3{font-size:16px;font-weight:700}
.shelf-h .ar{margin-left:auto;display:flex;gap:6px}
.shelf-h .ar button{width:32px;height:32px;border-radius:50%;border:1px solid var(--s200);background:#fff;display:grid;place-items:center}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 2px 8px}
.scard{flex:0 0 250px;scroll-snap-align:start;cursor:pointer}
.scard .th{height:160px;border-radius:18px;margin-bottom:10px;box-shadow:0 10px 24px -16px rgba(15,23,42,.5)}
.scard:hover .th img{transform:scale(1.07)}
.scard .t{font-weight:700;font-size:14px}

/* ---------- 9 · Moodboard ---------- */
.mood{columns:4 240px;column-gap:14px}
.mt{break-inside:avoid;margin-bottom:14px;border-radius:18px;position:relative;cursor:pointer;transition:opacity .3s,transform .3s var(--ease),filter .3s}
.mt .th{border-radius:18px}
.mood.hov .mt{opacity:.28;filter:grayscale(.6)}
.mood.hov .mt.on{opacity:1;filter:none;transform:scale(1.015)}
.mt .lab{position:absolute;left:10px;bottom:10px;right:10px;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(6px);transition:all .3s var(--ease)}
.mt.on .lab,.mt:hover .lab{opacity:1;transform:none}
.mt .corner{position:absolute;top:10px;left:10px;width:12px;height:12px;border-radius:4px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mt.note{padding:16px;background:#fff;border:1px solid var(--s200)}

/* ---------- 10 · Departures ---------- */
.dep{background:linear-gradient(180deg,#1e293b,#0f172a);border-radius:22px;padding:20px;color:#e2e8f0;box-shadow:0 30px 60px -30px rgba(15,23,42,.6);overflow-x:auto}
.dep-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-width:900px}
.dep-h h3{font-size:20px;font-weight:800;letter-spacing:.02em;color:#fff}
.dep-g{min-width:900px}
.dep-r{display:grid;grid-template-columns:70px 2.1fr 1.4fr 1.1fr 2fr 130px;gap:14px;align-items:center;padding:9px 6px;border-top:1px solid rgba(148,163,184,.14);cursor:pointer;border-radius:10px;transition:background .15s}
.dep-r:hover{background:rgba(148,163,184,.08)}
.dep-r.hd{cursor:default;border-top:0}
.dep-r.hd:hover{background:none}
.dep-r.hd span{font-size:10px;font-weight:700;letter-spacing:.12em;color:#94a3b8}
.flaps{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden}
.fl{display:inline-grid;place-items:center;width:15px;height:24px;border-radius:3px;background:linear-gradient(180deg,#334155 50%,#1e293b 50%);font-size:14px;font-weight:700;color:#f8fafc;position:relative;flex:none;text-transform:uppercase}
.fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(15,23,42,.9)}
.fl.sp{background:none}
.fl.sp::after{display:none}
.st-s{font-size:12px;font-weight:800;letter-spacing:.1em;padding:5px 10px;border-radius:6px;text-align:center}

/* ---------- peek modal + menu + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,24,47,.4);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
.scrim.on{opacity:1;pointer-events:auto}
.peek{position:fixed;left:50%;top:50%;width:min(860px,94vw);max-height:90vh;overflow-y:auto;transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:201;background:#fff;border-radius:24px;border:1px solid var(--s200);box-shadow:0 40px 80px -20px rgba(15,23,42,.45)}
.peek.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.peek .hero{height:240px;border-radius:24px 24px 0 0}
.peek .hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(15,23,42,.65))}
.peek .hero .ttl{position:absolute;left:24px;bottom:20px;right:24px;color:#fff}
.peek .hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.peek .bd{padding:22px 24px}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 20px}
.steps5 div{font-size:11px;font-weight:700;color:var(--s400)}
.steps5 div i{display:block;height:6px;border-radius:9px;background:var(--s200);margin-bottom:6px}
.steps5 div.f i{background:var(--c)} .steps5 div.f{color:var(--s700)}
.steps5 div.now{color:var(--c)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.fcard{border:1px solid var(--s200);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:all .2s var(--ease)}
.fcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 18px -12px rgba(61,82,160,.5)}
.fcard .ic{width:36px;height:36px;border-radius:12px;background:var(--brandT);color:var(--brand);display:grid;place-items:center;flex:none}
.foot{display:flex;gap:8px;padding:14px 24px;background:var(--s50);border-top:1px solid var(--s100);border-radius:0 0 24px 24px;flex-wrap:wrap}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;z-index:3}
.menu{position:fixed;z-index:210;background:#fff;border:1px solid var(--s200);border-radius:14px;box-shadow:0 20px 40px -12px rgba(15,23,42,.3);padding:6px;min-width:200px;animation:pop .18s var(--ease)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--s700);text-align:left}
.menu button:hover{background:var(--s50)}
.menu button.d{color:var(--rose7)}
.menu hr{border:0;border-top:1px solid var(--s100);margin:4px 0}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,16px);opacity:0;background:var(--s800);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:all .25s var(--ease);z-index:300;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- mockup dock (not part of the app) ---------- */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:150;width:min(1100px,calc(100vw - 24px));background:rgba(15,23,42,.92);backdrop-filter:blur(16px);color:#fff;border-radius:20px;padding:10px 10px 10px 14px;box-shadow:0 24px 50px -16px rgba(15,23,42,.6)}
.dock-t{display:flex;align-items:center;gap:10px;font-size:12px;color:#cbd5e1;margin-bottom:8px;padding-right:4px}
.dock-t b{color:#fff;font-size:14px}
.dock-t .why{margin-left:auto;text-align:right;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-o{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dk{min-width:0;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12px;font-weight:700;color:#cbd5e1;transition:all .2s var(--ease)}
.dk:hover{background:rgba(255,255,255,.12)}
.dk .bd{width:6px;height:6px;border-radius:50%;background:#e9c77c;flex:none;margin-left:auto}
.dk.on .bd{background:var(--gold)}
.dk .n{flex:none;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11px}
.dk.on{background:#fff;color:var(--s800)}
.dk.on .n{background:var(--brand);color:#fff}
.dnav{display:flex;gap:4px;margin-left:8px}
.dnav button{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:16px;font-weight:800;line-height:1}
.dnav button:hover{background:rgba(255,255,255,.22)}
.kind{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.kind.bold{background:rgba(184,146,58,.22);color:#e9c77c}
.kind.prac{background:rgba(255,255,255,.12);color:#cbd5e1}
.dk.on .kind.bold{background:#fef3c7;color:var(--amber7)}
.dk.on .kind.prac{background:var(--s100);color:var(--s600)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .bt-need,.bt-site,.bt-a,.bt-hand,.bt-closed{grid-column:span 12}
  .spot{grid-template-columns:1fr}
  .spot .th{min-height:220px}
  .ix-r{grid-template-columns:40px 1fr;gap:8px 14px}
  .ix-r .c3,.ix-r .c4{display:none}
  .ix-r .c5{grid-column:2}
  .ix-r .nm{font-size:24px}
  .ix-r .mth{display:block}
  .follow{display:none}
}
@media (max-width:760px){
  .wrap{padding:16px 14px 0}
  .top{padding:8px 12px}
  .who b,.sa{display:none}
  .search{min-width:0;width:100%;order:5}
  .lg-h{display:none}
  .lg-r{grid-template-columns:1fr 32px;gap:8px}
  .lg-r .c2,.lg-r .c3{display:none}
  .lg-r .c4{grid-column:1}
  .cf{height:400px}
  .cf-c{width:300px;height:330px;margin-left:-150px}
  .cf-nav{display:none}
  .mood{columns:2 150px;column-gap:10px}
  .dock-t .why{display:none}
  .dnav{margin-left:auto}
  .dock-o{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
  .dk{flex:none;scroll-snap-align:start}
  .toast{bottom:120px}
}

/* ---------- dock: 11 entries ---------- */
.dock-o{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.dk{min-width:0;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12px;font-weight:700;color:#cbd5e1;transition:all .2s var(--ease)}
.dk .n{flex:none;min-width:20px;padding:0 4px}
.dk .bd{width:6px;height:6px;border-radius:50%;background:#e9c77c;flex:none;margin-left:auto}
.dk.rec{background:rgba(61,82,160,.55);color:#fff}
.dk.rec .n{background:rgba(255,255,255,.2)}
.dk.on .bd{background:var(--gold)}
.kind.rec{background:#fff;color:var(--brand)}
.dnav{display:flex;gap:4px;margin-left:8px}
.dnav button{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:16px;font-weight:800;line-height:1}
.dnav button:hover{background:rgba(255,255,255,.22)}
body{padding-bottom:170px!important}
.toast{bottom:150px}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--s800);color:#fff;font-size:12px;font-weight:600;padding:7px 10px;border-radius:10px;display:none;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(15,23,42,.5)}

/* ---------- Recommended ---------- */
.rj{display:flex;align-items:center;padding:10px;overflow-x:auto;margin-bottom:14px}
.rj-s{flex:1;min-width:190px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-align:left;transition:all .25s var(--ease)}
.rj-s:hover{background:var(--s50)}
.rj-s.on{background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:inset 0 0 0 1.5px var(--c)}
.rj-ring{width:18px;height:18px;border-radius:50%;border:5px solid var(--c);background:#fff;flex:none;transition:transform .25s var(--ease)}
.rj-s.on .rj-ring{transform:scale(1.2)}
.rj-t{display:flex;flex-direction:column;min-width:0}
.rj-t b{font-size:14px;font-weight:700;white-space:nowrap}
.rj-toks{display:flex;margin-left:auto;padding-left:8px}
.rj-tok{width:28px;height:28px;border-radius:50%;overflow:hidden;margin-left:-9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--s200);flex:none}
.rj-tok .ph{width:100%;height:100%}
.rj-tok .ph .none span,.rj-tok .ph .none svg{display:none}
.rj-more{font-size:11px;font-weight:700;color:var(--s500);margin-left:4px;align-self:center}
.rj-line{width:22px;height:3px;border-radius:9px;background:linear-gradient(90deg,var(--s200),var(--s300));flex:none}
.rj-closed{flex:none;margin-left:10px;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:700;color:var(--s600);border:1px dashed var(--s300);white-space:nowrap}
.rj-closed.on{background:var(--s100);border-style:solid}
.rtool{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.rov{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-bottom:16px}
.rov .spot{margin-bottom:0;min-height:300px}
.rov .spot .th{min-height:300px}
.rneed{padding:18px;display:flex;flex-direction:column}
.rneed h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rneed h3 .n{margin-left:auto;font-size:24px;font-weight:900}
.rneed .sc{overflow-y:auto;max-height:262px;margin-top:6px}
.seg2{display:inline-flex;padding:4px;border-radius:12px;background:var(--s100);position:relative;margin-left:auto}
.seg2 button{position:relative;z-index:1;padding:6px 14px;border-radius:9px;font-size:12px;font-weight:700;color:var(--s500);display:flex;align-items:center;gap:6px;transition:color .2s}
.seg2 button.on{color:var(--s800)}
.seg2 .pill{position:absolute;top:4px;bottom:4px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.12);transition:left .35s var(--ease),width .35s var(--ease)}

/* ---------- 11 · Week planner ---------- */
.wk{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.wk-c{background:rgba(255,255,255,.65);border:1px solid var(--s200);border-radius:18px;padding:10px;min-height:420px;transition:box-shadow .2s}
.wk-c.today{background:#fff;box-shadow:inset 0 0 0 2px var(--brand)}
.wk-c.past{background:repeating-linear-gradient(135deg,rgba(241,245,249,.9) 0 8px,rgba(255,255,255,.7) 8px 16px)}
.wk-c.over{box-shadow:inset 0 0 0 2px var(--s400)}
.wk-h{display:flex;align-items:baseline;gap:8px;padding:4px 4px 12px}
.wk-h b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.wk-i{background:#fff;border:1px solid var(--s200);border-left:4px solid var(--k);border-radius:12px;padding:10px;margin-bottom:8px;cursor:grab;transition:transform .2s var(--ease),box-shadow .2s}
.wk-i:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px rgba(15,23,42,.35)}
.wk-i .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.wk-i .th{width:30px;height:30px;border-radius:9px;flex:none}
.wk-i .th .none span,.wk-i .th .none svg{display:none}

/* ---------- 12 · Designer lanes ---------- */
.dl{display:grid;grid-template-columns:200px repeat(6,minmax(150px,1fr));overflow-x:auto}
.dl>div{border-top:1px solid var(--s100);border-left:1px solid var(--s100);padding:10px;min-height:104px;transition:background .15s}
.dl>div.hd{min-height:0;padding:12px 10px;background:var(--s50)}
.dl>div.over{background:var(--brandT)}
.dl .who2{display:flex;gap:10px;align-items:flex-start;border-left:0}
.dl .who2 .own{width:36px;height:36px;font-size:12px;border:0}
.loadbar{height:5px;border-radius:9px;background:var(--s100);margin-top:8px;overflow:hidden}
.loadbar i{display:block;height:100%;border-radius:9px;background:var(--brand)}
.dlc{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--s200);border-left:3px solid var(--c);border-radius:10px;padding:6px 8px;margin-bottom:6px;cursor:grab;font-size:12px;font-weight:700;transition:transform .2s var(--ease),box-shadow .2s}
.dlc:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(15,23,42,.35)}
.dlc .th{width:24px;height:24px;border-radius:7px;flex:none}
.dlc .th .none span,.dlc .th .none svg{display:none}

/* ---------- 13 · Site map ---------- */
.mapw{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
.map{padding:0;overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer;transition:transform .25s var(--ease)}
.pin:hover{transform:scale(1.15)}
.pulse{animation:mp 2.4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes mp{0%{opacity:.6;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.place{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .15s}
.place:hover,.place.on{background:var(--s50)}
.place.on{box-shadow:inset 0 0 0 1.5px var(--brand)}

/* ---------- 14 · Command bar ---------- */
.cmd{max-width:760px;margin:10px auto 0;border-radius:24px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(15,23,42,.45)}
.cmd-i{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--s100)}
.cmd-i input{flex:1;border:0;outline:0;font-size:20px;font-weight:600;background:none}
.kb{font-size:11px;font-weight:700;color:var(--s500);border:1px solid var(--s200);border-radius:6px;padding:1px 6px;background:var(--s50)}
.cmd-g{padding:10px 10px 4px}
.cmd-g .lbl{padding:4px 12px 6px}
.cmd-r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer}
.cmd-r.on{background:var(--brandT)}
.cmd-r .ic2{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--s100);color:var(--s500)}
.cmd-r.on .ic2{background:var(--brand);color:#fff}
.cmd-r .th{width:34px;height:34px;border-radius:10px;flex:none}
.cmd-r .th .none span,.cmd-r .th .none svg{display:none}
.cmd-f{display:flex;gap:14px;padding:12px 22px;background:var(--s50);border-top:1px solid var(--s100);font-size:12px;color:var(--s500)}

/* ---------- 15 · Triage deck ---------- */
.deckw{display:grid;grid-template-columns:1fr minmax(300px,420px) 1fr;gap:20px;align-items:start}
.deck{position:relative;height:540px}
.tc{position:absolute;inset:0;border-radius:26px;background:#fff;border:1px solid var(--s200);box-shadow:0 30px 50px -30px rgba(15,23,42,.45);overflow:hidden;transition:transform .4s var(--ease),opacity .4s;touch-action:none;user-select:none}
.tc.top{cursor:grab}
.tc .th{height:250px}
.tc .bd2{padding:18px 20px}
.stamp{position:absolute;top:24px;font-size:20px;font-weight:900;letter-spacing:.1em;padding:6px 14px;border-radius:10px;border:3px solid;opacity:0;z-index:3;background:rgba(255,255,255,.85)}
.stamp.yes{left:20px;color:var(--em7);transform:rotate(-12deg)}
.stamp.no{right:20px;color:var(--s600);transform:rotate(12deg)}
.dbtns{display:flex;justify-content:center;gap:12px;margin-top:16px}
.dbtns button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--s200);box-shadow:0 10px 20px -12px rgba(15,23,42,.4);transition:transform .2s var(--ease)}
.dbtns button:hover{transform:scale(1.08)}
.dbtns .big{width:66px;height:66px;background:var(--brand);color:#fff;border:0}
.tq{display:flex;flex-direction:column;gap:6px}
.tq .it{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:var(--s600);padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid var(--s200)}

/* ---------- 16 · Blueprints ---------- */
.bps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.bp{border-radius:20px;overflow:hidden;cursor:pointer;color:#e2e8f0;position:relative;background:
  linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/20px 20px,
  linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/20px 20px,
  linear-gradient(160deg,#30438a,#1f2b5c);box-shadow:0 20px 40px -24px rgba(15,23,42,.6);transition:transform .3s var(--ease)}
.bp:hover{transform:translateY(-3px)}
.bp svg{display:block;width:100%;height:auto;padding:14px 14px 0}
.bp .ln{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1.2s var(--ease)}
.bp:not(:hover) .ln.d{stroke-dashoffset:0}
.bp.draw .ln{stroke-dashoffset:1;transition:none}

.tb{display:grid;grid-template-columns:1fr auto;border-top:1px solid rgba(255,255,255,.18);margin-top:8px}
.tb>div{padding:10px 14px}
.tb>div+div{border-left:1px solid rgba(255,255,255,.18);display:flex;align-items:center}
.tb .nm2{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff}

/* ---------- 17 · Orbit ---------- */
.orb{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.orb svg{display:block;width:100%;height:auto;max-height:640px}
.onode{cursor:pointer}
.orbleg .row2{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:default;transition:background .15s}
.orbleg .row2:hover{background:var(--s50)}

/* ---------- 18 · Photo timeline ---------- */
.ptl{overflow-x:auto}
.ptl-g{position:relative;min-width:1100px}
.ptl-h{display:grid;grid-template-columns:240px repeat(11,1fr);position:sticky;top:0;z-index:2}
.ptl-h div{font-size:11px;font-weight:700;color:var(--s500);padding:10px 8px;border-left:1px solid var(--s100);background:var(--s50)}
.ptl-r{display:grid;grid-template-columns:240px 1fr;border-top:1px solid var(--s100);height:64px;position:relative}
.ptl-n{display:flex;gap:10px;align-items:center;padding:0 12px;cursor:pointer}
.ptl-n .th{width:40px;height:40px;border-radius:10px;flex:none}
.ptl-n .th .none span,.ptl-n .th .none svg{display:none}
.ptl-bar{position:absolute;top:14px;height:36px;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer;transition:filter .15s,transform .2s var(--ease);box-shadow:0 8px 18px -12px rgba(15,23,42,.6)}
.ptl-bar:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ptl-bar .th{width:28px;height:28px;border-radius:8px;flex:none;border:2px solid rgba(255,255,255,.5)}
.ptl-bar .th .none span,.ptl-bar .th .none svg{display:none}
.ptl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--rose);z-index:3}
.ptl-today span{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;color:var(--rose7);background:#fff;padding:1px 6px;border-radius:6px;letter-spacing:.06em}

/* ---------- 19 · Health rings ---------- */
.hr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hrc{padding:16px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.hrc:hover{transform:translateY(-2px);box-shadow:0 16px 30px -20px rgba(15,23,42,.4)}
.hrc .in{display:flex;gap:16px;align-items:center}
.hrc svg{flex:none}
.hrc circle.v{transition:stroke-dashoffset 1.2s var(--ease)}
.lg2{display:flex;flex-direction:column;gap:6px;font-size:12px}
.lg2 div{display:flex;align-items:center;gap:8px}
.lg2 b{font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- 20 · Studio feed ---------- */
.feed{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.fe{padding:16px 18px;margin-bottom:12px}

.fe .strip2{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.fe .strip2 .th{flex:0 0 180px;height:120px;border-radius:14px}
.fe .act2{display:flex;gap:8px;margin-top:12px}
.side2{position:sticky;top:80px}

 {n:'Command bar',k:'bold',why:'Raycast / Linear ⌘K: type to find a project or do its next step, keyboard only.'},
 {n:'Triage deck',k:'bold',why:'What needs you, one card at a time. Swipe right to do it, left to snooze (or ← →).'},
 {n:'Blueprints',k:'bold',why:'Each project drawn as its own floor plan on blueprint paper; lines redraw on hover.'},
 {n:'Orbit',k:'bold',why:'Projects orbit the studio: each ring is a stage, inner rings are nearer handover.'},
 {n:'Photo timeline',k:'prac',why:'Linear Timeline with renders on the bars; today marked in red.'},
 {n:'Health rings',k:'prac',why:'Apple Fitness rings per project: journey, drawings issued, snags closed.'},
 {n:'Studio feed',k:'prac',why:'What changed today as a feed with site photos, beside what needs you.'}
];

/* ============ STATE ============ */
let st={v:0,stage:'all',kind:'all',q:'',need:null,spot:0,rmode:'overview',wk:{},cq:'',ci:0,tri:new Set(),place:null};
try{const s=+localStorage.getItem('sd_r3');if(s>=0&&s<11)st.v=s}catch(e){}
let timers=[],rafs=[];

function list(){
  const q=st.q.toLowerCase();
  return P.filter(p=>(st.stage==='all'||p.stage===st.stage||(st.stage==='closed'&&['lost','terminated'].includes(p.stage)))
    &&(st.kind==='all'||p.tag===st.kind)&&(!st.need||(p.next&&p.next.k===st.need))
    &&(!q||(p.name+p.client+p.loc+p.kind).toLowerCase().includes(q)));
}
const tip=(e,h)=>{const t=$('#tip');if(!h){t.style.display='none';return}t.innerHTML=h;t.style.display='block';t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px'};
const kcol=k=>k==='block'?'var(--rose)':k==='due'?'var(--gold)':'var(--brand)';

/* ============ SHELL ============ */
function shell(){
  const base=P.filter(p=>st.kind==='all'||p.tag===st.kind);
  const nb=base.filter(p=>p.next&&p.next.k==='block').length, nd=base.filter(p=>p.next&&p.next.k==='due').length;
  $('#needs').innerHTML=`<button class="bchip r ${st.need==='block'?'on':''}" onclick="st.need=st.need==='block'?null:'block';render()">${nb} blockers</button><button class="bchip a ${st.need==='due'?'on':''}" onclick="st.need=st.need==='due'?null:'due';render()">${nd} due this week</button>`;
  $('#kinds').innerHTML=[['all','All'],['actual','Actual'],['dummy','Dummy']].map(([k,l])=>`<button class="${st.kind===k?'on':''}" onclick="st.kind='${k}';render()">${l}</button>`).join('');
  const cnt=k=>base.filter(p=>p.stage===k).length;
  const sg=$('#stages'); sg.style.display=st.v===0?'none':'flex';
  sg.innerHTML=`<button class="stg ${st.stage==='all'?'on':''}" onclick="st.stage='all';render()">All projects <span class="c">${base.length}</span></button>`+
    ORDER.map(k=>`<button class="stg ${st.stage===k?'on':''}" onclick="st.stage='${k}';render()"><i style="background:${STAGE[k].c}"></i>${STAGE[k].label} <span class="c">${cnt(k)}</span></button>`).join('');
  $('#dock').innerHTML=C.map((c,i)=>`<button class="dk ${i===0?'rec':''} ${i===st.v?'on':''}" onclick="go(${i})"><span class="n">${i===0?'★':i+10}</span>${c.n}${c.k==='bold'?'<span class="bd" title="Bold"></span>':''}</button>`).join('');
  $('#dpos').textContent=st.v===0?'·':`${st.v+10} ·`;
  $('#dname').textContent=C[st.v].n; const dk=$('#dkind');
  dk.className='kind '+({bold:'bold',prac:'prac',rec:'rec'}[C[st.v].k]); dk.textContent={bold:'Bold',prac:'Practical',rec:'My pick'}[C[st.v].k];
  $('#dwhy').textContent=C[st.v].why;
}
function go(i){st.v=i;if(i===0&&['lead','proposal','won','execution','completed','all','closed'].indexOf(st.stage)<0)st.stage='all';try{localStorage.setItem('sd_r3',i)}catch(e){};render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  timers.forEach(clearInterval);timers=[];rafs.forEach(cancelAnimationFrame);rafs=[];tip(null);
  shell(); const el=$('#view'); el.className='swap'; void el.offsetWidth;
  const ls=list();
  if(!ls.length&&![0,4,5].includes(st.v)){el.innerHTML=`<div class="panel empty"><b>No projects here</b><span class="meta">Try another stage or clear the search.</span></div>`;return}
  V[st.v](el,ls);
}

/* ============ SHARED BLOCKS (from round 2: ledger, spotlight, shelves) ============ */
function ledgerHTML(ls){
  const groups=ORDER; let i=0;
  return `<div class="panel rise" style="overflow:hidden">
   <div class="lg-h"><span class="lbl">Project</span><span class="lbl c2">Journey</span><span class="lbl c3">Tags</span><span class="lbl c4">Next step</span><span></span></div>
   ${groups.map(k=>{const items=ls.filter(p=>p.stage===k);if(!items.length)return'';
     return `<div class="lg-grp"><span class="sdot" style="background:${STAGE[k].c}"></span>${STAGE[k].label}<span style="color:var(--s400)">${items.length}</span></div>`+
     items.map(p=>`<div class="lg-r rise" style="animation-delay:${(i++)*30}ms" onclick="peek(${p.id})">
       <div class="lg-p">${th(p,200)}<div style="min-width:0"><div class="t">${p.name}</div><div class="meta">${meta(p)}</div>
         <div class="files">${FILES[p.stage].map(f=>`<button class="file" onclick="event.stopPropagation();toast('Opens ${f[0]}')">${ic('file',12)}${f[0]}</button>`).join('')}</div></div></div>
       <div class="c2">${journey(p)}<div class="help" style="margin-top:6px">${S(p).step>=0?STEPS[S(p).step]:S(p).label} · ${p.upd}</div></div>
       <div class="c3">${tags(p)}</div>
       <div class="c4" style="display:flex;align-items:center;gap:8px">${nextBtn(p)}</div>
       <div>${moreBtn(p)}</div></div>`).join('')}).join('')||'<div class="empty"><span class="meta">No projects match.</span></div>'}
  </div>`;
}
function spotHTML(ls){
  const urgent=ls.filter(p=>p.next).sort((a,b)=>({block:0,due:1,go:2}[a.next.k])-({block:0,due:1,go:2}[b.next.k])).slice(0,4);
  if(!urgent.length) return `<div class="panel empty" style="display:grid;place-items:center"><div><b>Nothing urgent here</b><span class="meta">Every project in this view is on track.</span></div></div>`;
  st.spot=Math.min(st.spot,urgent.length-1); const h=urgent[st.spot];
  return `<div class="spot panel rise">${th(h,1400)}<div class="side">
      <span class="lbl" style="color:${h.next.k==='block'?'var(--rose7)':h.next.k==='due'?'var(--amber7)':'var(--brand)'}">${h.next.k==='block'?'Blocked · needs you first':h.next.k==='due'?'Due this week':'Up next'}</span>
      <h2 style="font-size:20px">${h.name}</h2><div class="meta">${meta(h)}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${chipStage(h)}${tags(h)}</div>
      <div style="margin:6px 0 0">${journey(h)}</div>
      <div style="font-size:16px;font-weight:700;margin-top:8px">${h.next.t}</div><div class="help">Opens ${h.next.f}. Designer ${h.own}, updated ${h.upd}.</div>
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${nextBtn(h,false)}<button class="btn s" onclick="peek(${h.id})">Open project</button></div>
      <div class="spdots">${urgent.map((u,i)=>`<button class="${i===st.spot?'on':''}" onclick="st.spot=${i};render()" aria-label="${u.short}"></button>`).join('')}</div></div></div>`;
}
function shelvesHTML(ls){
  return ORDER.filter(k=>ls.some(p=>p.stage===k)).map((k,si)=>{const items=ls.filter(p=>p.stage===k);return `<div class="shelf rise" style="animation-delay:${si*60}ms"><div class="shelf-h"><span class="sdot" style="background:${STAGE[k].c}"></span><h3>${STAGE[k].label}</h3><span class="help">${items.length}</span>
      <div class="ar"><button onclick="this.closest('.shelf').querySelector('.row').scrollBy({left:-520})">${ic('left',16)}</button><button onclick="this.closest('.shelf').querySelector('.row').scrollBy({left:520})">${ic('right',16)}</button></div></div>
      <div class="row">${items.map(p=>`<div class="scard" onclick="peek(${p.id})">${th(p,500)}<div class="t">${p.short}</div><div class="help" style="margin-bottom:6px">${p.client} · ${p.kind}</div>${p.next?`<span class="chip ${p.next.k==='block'?'bad':p.next.k==='due'?'warn':'brand'}">${p.next.t}</span>`:''}</div>`).join('')}</div></div>`}).join('')||'<div class="panel empty"><span class="meta">No projects match.</span></div>';
}
function needsHTML(ls){
  const needs=ls.filter(p=>p.next&&p.next.k!=='go').sort((a,b)=>(a.next.k==='block'?0:1)-(b.next.k==='block'?0:1));
  return `<div class="panel rneed rise" style="animation-delay:60ms"><h3><span class="sdot" style="background:var(--rose)"></span>Needs you<span class="n tnum">${needs.length}</span></h3><div class="help">Blockers first, then what is due this week.</div>
   <div class="sc">${needs.map(p=>`<div class="nrow" onclick="peek(${p.id})">${th(p,120)}<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${p.next.t}</div><div class="help">${p.short} · ${p.client}</div></div>${nextBtn({...p,next:{...p.next,t:p.next.k==='block'?'Fix':'Do'}})}</div>`).join('')||'<div class="help" style="padding:12px 0">Nothing blocked or due here.</div>'}</div></div>`;
}

/* ============ VIEWS ============ */
const V=[];

/* ★ Recommended: one screen built from Journey line + Spotlight + Bento "Needs you" + Ledger (+ Shelves) */
V[0]=(el,ls)=>{
  const base=P.filter(p=>(st.kind==='all'||p.tag===st.kind)&&(!st.need||(p.next&&p.next.k===st.need))&&(!st.q||(p.name+p.client+p.loc).toLowerCase().includes(st.q.toLowerCase())));
  const closedN=base.filter(p=>['lost','terminated'].includes(p.stage)).length;
  const strip=`<div class="panel rj rise">${FLOW.map(k=>{const n=base.filter(p=>p.stage===k);const b=n.filter(p=>p.next&&p.next.k==='block').length;
     return `<button class="rj-s ${st.stage===k?'on':''}" style="--c:${STAGE[k].c}" onclick="st.stage=st.stage==='${k}'?'all':'${k}';render()"><span class="rj-ring"></span><span class="rj-t"><b>${STAGE[k].label}</b><span class="help">${n.length} project${n.length===1?'':'s'}${b?` · <span style="color:var(--rose7);font-weight:700">${b} blocked</span>`:''}</span></span><span class="rj-toks">${n.slice(0,3).map(p=>`<span class="rj-tok">${th(p,80)}</span>`).join('')}${n.length>3?`<span class="rj-more">+${n.length-3}</span>`:''}</span></button>`}).join('<span class="rj-line"></span>')}
     <button class="rj-closed ${st.stage==='closed'?'on':''}" onclick="st.stage=st.stage==='closed'?'all':'closed';render()">Closed · ${closedN}</button></div>`;
  const modes=[['overview','Overview'],['list','List'],['shelves','Shelves']];
  const label=st.stage==='all'?'All projects':st.stage==='closed'?'Lost and terminated':STAGE[st.stage].label;
  const tool=`<div class="rtool"><b style="font-size:16px">${label}</b><span class="help">${ls.length} shown${st.stage!=='all'?` · <button style="color:var(--brand);font-weight:700;font-size:11px" onclick="st.stage='all';render()">Show all</button>`:''}</span>
     <div class="seg2" id="seg2">${modes.map(([k,l])=>`<button data-k="${k}" class="${st.rmode===k?'on':''}" onclick="st.rmode='${k}';render()">${l}</button>`).join('')}<span class="pill"></span></div></div>`;
  let main='';
  if(st.rmode==='overview') main=`<div class="rov">${spotHTML(ls)}${needsHTML(ls)}</div>${ledgerHTML(ls)}`;
  if(st.rmode==='list') main=ledgerHTML(ls);
  if(st.rmode==='shelves') main=shelvesHTML(ls);
  el.innerHTML=strip+tool+main;
  const seg=$('#seg2'),on=seg.querySelector('button.on'),pill=seg.querySelector('.pill');
  pill.style.left=on.offsetLeft+'px';pill.style.width=on.offsetWidth+'px';
};

/* 11 · Week planner */
V[1]=(el,ls)=>{
  const dayOf=p=>st.wk[p.id]??DUE_DAY[p.id];
  const withNext=ls.filter(p=>p.next), none=ls.filter(p=>!p.next);
  el.innerHTML=`<div class="wk">${DAYS.map((d,i)=>{const items=withNext.filter(p=>dayOf(p)===i).sort((a,b)=>({block:0,due:1,go:2}[a.next.k])-({block:0,due:1,go:2}[b.next.k]));
    return `<div class="wk-c ${i===2?'today':''} ${i<2?'past':''} rise" style="animation-delay:${i*40}ms" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="wkDrop(event,${i})">
      <div class="wk-h"><span class="lbl">${d[0]}</span><b>${d[1]}</b>${i===2?'<span class="chip brand" style="margin-left:auto">Today</span>':''}${i<2&&items.length?'<span class="chip bad" style="margin-left:auto">Overdue</span>':''}</div>
      ${items.map(p=>`<div class="wk-i" style="--k:${kcol(p.next.k)}" draggable="true" ondragstart="event.dataTransfer.setData('id',${p.id})" onclick="peek(${p.id})">
        <div class="top">${th(p,80)}<div style="min-width:0"><div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.short}</div><div class="help">${S(p).label}</div></div></div>
        <div style="font-size:14px;font-weight:700;line-height:1.3;margin-bottom:8px">${p.next.t}</div>${nextBtn({...p,next:{...p.next,t:'Do it'}})}</div>`).join('')||'<div class="help" style="padding:8px 4px">Free</div>'}
    </div>`}).join('')}</div>
    ${none.length?`<div class="help" style="margin-top:12px">No next step: ${none.map(p=>`<button style="font-weight:700;color:var(--s700);font-size:11px" onclick="peek(${p.id})">${p.short}</button>`).join(', ')}</div>`:''}
    <div class="help" style="margin-top:6px">Drag a card to another day to reschedule it. Red edge = blocking, gold = due.</div>`;
};
function wkDrop(e,i){e.preventDefault();const id=+e.dataTransfer.getData('id');st.wk[id]=i;toast(`Moved to ${DAYS[i][0]} ${DAYS[i][1]} Nov`);render()}

/* 12 · Designer lanes */
V[2]=(el,ls)=>{
  const cols=[...FLOW,'closed'];
  const inCol=(p,c)=>c==='closed'?['lost','terminated'].includes(p.stage):p.stage===c;
  const max=Math.max(...Object.keys(DES).map(d=>ls.filter(p=>p.own===d&&FLOW.includes(p.stage)&&p.stage!=='completed').length),1);
  el.innerHTML=`<div class="panel rise" style="overflow:hidden"><div class="dl">
    <div class="hd" style="border-left:0"><span class="lbl">Designer</span></div>${cols.map(c=>`<div class="hd"><span class="lbl" style="display:flex;align-items:center;gap:6px"><span class="sdot" style="background:${c==='closed'?'#64748b':STAGE[c].c}"></span>${c==='closed'?'Closed':STAGE[c].label}</span></div>`).join('')}
    ${Object.entries(DES).map(([d,name])=>{const mine=ls.filter(p=>p.own===d);const live=mine.filter(p=>['lead','proposal','won','execution'].includes(p.stage)).length;const bl=mine.filter(p=>p.next&&p.next.k==='block').length;
      return `<div class="who2"><span class="own" style="background:${OWN[d]}">${d}</span><div style="flex:1;min-width:0"><div style="font-weight:700">${name}</div><div class="help">${live} live${bl?` · <span style="color:var(--rose7);font-weight:700">${bl} blocked</span>`:''}</div><div class="loadbar"><i style="width:${live/max*100}%;background:${live>=max?'var(--gold)':'var(--brand)'}"></i></div></div></div>`+
      cols.map(c=>`<div ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dlDrop(event,'${d}')">${mine.filter(p=>inCol(p,c)).map(p=>`<div class="dlc" style="--c:${S(p).c}" draggable="true" ondragstart="event.dataTransfer.setData('id',${p.id})" onclick="peek(${p.id})" title="${p.next?p.next.t:'Nothing pending'}">${th(p,80)}<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.short}</span>${p.next&&p.next.k!=='go'?`<span class="sdot" style="background:${kcol(p.next.k)}"></span>`:''}</div>`).join('')}</div>`).join('')}).join('')}
  </div></div><div class="help" style="margin-top:8px">Drag a project to another designer's row to reassign it. The bar shows live load; gold = the busiest.</div>`;
};
function dlDrop(e,d){e.preventDefault();const p=P.find(x=>x.id==e.dataTransfer.getData('id'));if(p&&p.own!==d){p.own=d;toast(`${p.short} assigned to ${DES[d]}`);render()}}

/* 13 · Site map */
V[3]=(el,ls)=>{
  const places=Object.keys(LOC).map(l=>({l,items:ls.filter(p=>p.loc===l)})).filter(x=>x.items.length);
  const shown=st.place?ls.filter(p=>p.loc===st.place):ls;
  const pins=places.map(({l,items})=>{const [cx,cy]=LOC[l];return items.map((p,k)=>{const n=items.length;const a=k/n*Math.PI*2-Math.PI/2;const inner=Math.min(n,6),outer=n>6;const ring2=outer&&k>=inner;const kk=ring2?k-inner:k,nn=ring2?n-inner:inner;const aa=kk/nn*Math.PI*2-Math.PI/2+(ring2?.3:0);const r=n>1?(ring2?78:40):0;const x=cx+Math.cos(aa)*r,y=cy+Math.sin(aa)*r;
     return `<g class="pin" data-id="${p.id}" onclick="peek(${p.id})">${p.next&&p.next.k==='block'?`<circle class="pulse" cx="${x}" cy="${y}" r="20" fill="#e11d48"/>`:''}<circle cx="${x}" cy="${y}" r="20" fill="${S(p).c}"/>${p.imgs.length?`<image href="${iurl(p.imgs[0],100)}" x="${x-16}" y="${y-16}" width="32" height="32" clip-path="url(#cpc)" preserveAspectRatio="xMidYMid slice"/>`:`<circle cx="${x}" cy="${y}" r="16" fill="#fff" opacity=".9"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="${S(p).c}">${p.short.slice(0,2).toUpperCase()}</text>`}</g>`}).join('')}).join('');
  el.innerHTML=`<div class="mapw"><div class="panel map rise"><svg viewBox="0 0 900 520">
     <defs><clipPath id="cpc" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
       <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd5e1"/></pattern></defs>
     <rect width="900" height="520" fill="#f8fafc"/><rect width="900" height="520" fill="url(#dots)" opacity=".6"/>
     <path d="M0 0H210C190 90 175 170 172 250C168 330 182 420 214 520H0Z" fill="rgba(61,82,160,.10)"/>
     <path d="M455 0C442 110 488 190 470 290C458 370 505 450 548 520" fill="none" stroke="rgba(61,82,160,.12)" stroke-width="30" stroke-linecap="round"/>
     <path d="M170 190C300 200 420 160 560 150S760 210 860 240" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
     <path d="M250 60L262 480M575 40L612 470" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
     <text x="60" y="300" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="2">ARABIAN SEA</text>
     <text x="478" y="430" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="2" transform="rotate(-70 478 430)">THANE CREEK</text>
     ${Object.entries(LOC).map(([l,[x,y]])=>`<text x="${x}" y="${y+(l==='Thane'?112:58)}" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1.5">${l.replace('Green World, ','').toUpperCase()}</text>`).join('')}
     ${pins}
   </svg><div class="help" style="position:absolute;left:14px;bottom:10px">Schematic, not to scale · red pulse = blocked on site</div></div>
   <div class="panel rise" style="padding:14px;animation-delay:60ms"><div style="display:flex;align-items:center;margin-bottom:8px"><b style="font-size:16px">Places</b><button class="btn s sm" style="margin-left:auto" onclick="toast('Site round: Pali Hills → Thane (3 sites) → Airoli')">Plan a site round</button></div>
     <div class="place ${!st.place?'on':''}" onclick="st.place=null;render()"><b style="flex:1">Everywhere</b><span class="help">${ls.length}</span></div>
     ${places.map(({l,items})=>`<div class="place ${st.place===l?'on':''}" onclick="st.place='${l}';render()"><div style="flex:1"><b>${l}</b><div style="display:flex;gap:4px;margin-top:4px">${items.map(p=>`<span class="sdot" style="background:${S(p).c}"></span>`).join('')}</div></div><span class="help">${items.length}</span></div>`).join('')}
     <div style="border-top:1px solid var(--s100);margin-top:8px;padding-top:6px">${shown.map(p=>`<div class="mini" onclick="peek(${p.id})">${th(p,120)}<div style="flex:1;min-width:0"><div>${p.short}</div><div class="help">${S(p).label} · ${p.next?p.next.t:'nothing pending'}</div></div></div>`).join('')}</div></div></div>`;
  document.querySelectorAll('.pin').forEach(g=>{const p=P.find(x=>x.id==g.dataset.id);g.addEventListener('mousemove',e=>tip(e,`<b>${p.short}</b> · ${S(p).label}${p.next?'<br>'+p.next.t:''}`));g.addEventListener('mouseleave',()=>tip(null))});
};

/* 14 · Command bar */
function cmdItems(){
  const q=st.cq.trim().toLowerCase(); const ls=list(); const out=[];
  if(!q){
    ls.filter(p=>p.next&&p.next.k!=='go').sort((a,b)=>(a.next.k==='block'?0:1)-(b.next.k==='block'?0:1)).slice(0,5).forEach(p=>out.push({g:'Do next',p,t:p.next.t,s:`${p.short} · opens ${p.next.f}`,a:()=>doStep(p.id),k:p.next.k}));
    ls.filter(p=>['Today','1d','2d'].includes(p.upd)).slice(0,5).forEach(p=>out.push({g:'Recent projects',p,t:p.name,s:`${S(p).label} · ${p.client}`,a:()=>peek(p.id)}));

  el.innerHTML=`<div class="feed"><div>${items.map((f,i)=>{const p=P.find(x=>x.id===f.p);const who=f.w==='c'?`<span class="own" style="background:var(--s400)">${p.client.replace(/^(Mr\.|Ms\.)\s*/,'').slice(0,2).toUpperCase()}</span>`:`<span class="own" style="background:${OWN[f.w]}">${f.w}</span>`;
     return `<div class="panel fe rise" style="animation-delay:${i*40}ms"><div class="hd2">${who}<div style="flex:1;min-width:0"><div style="font-size:14px"><b>${f.w==='c'?'Client':DES[f.w]}</b> ${f.x}</div><div class="help"><button style="font-weight:700;color:var(--brand);font-size:11px" onclick="peek(${p.id})">${p.short}</button> · ${S(p).label} · ${f.t}</div></div>
       ${f.k==='block'?'<span class="chip bad">Blocker</span>':f.k==='due'?'<span class="chip warn">Watch</span>':f.k==='good'?'<span class="chip good">Done</span>':''}</div>
       ${f.imgs?`<div class="strip2">${f.imgs.map(j=>`<div class="ph th" style="--c:${S(p).c}"><img loading="lazy" src="${iurl(j,500)}" alt="" onerror="this.remove()"></div>`).join('')}</div>`:''}
       <div class="act2"><button class="btn s sm" onclick="peek(${p.id})">Open project</button>${p.next?nextBtn(p):''}</div></div>`}).join('')||'<div class="panel empty"><span class="meta">No activity for this filter.</span></div>'}</div>
    <div class="side2">${needsHTML(ls)}<div class="panel rise" style="padding:16px;margin-top:14px;animation-delay:100ms"><b style="font-size:16px">On site today</b>${ls.filter(p=>p.stage==='execution').map(p=>`<div class="mini" onclick="peek(${p.id})">${th(p,120)}<div style="flex:1;min-width:0"><div>${p.short}</div><div class="help">${DES[p.own]} · ${p.loc}</div></div></div>`).join('')||'<div class="help">No site running.</div>'}</div></div></div>`;
};

/* ============ PEEK (one click opens the project) ============ */
function peek(id){
  const p=P.find(x=>x.id===id); const s=S(p);
  $('#peek').innerHTML=`<button class="x glass" onclick="closePeek()">${ic('x',16)}</button>
   <div class="hero ph" style="--c:${s.c}">${p.imgs.length?`<img src="${iurl(p.imgs[0],1400)}" alt="" onerror="this.remove()">`:`<div class="none">${ic('ruler',28)}<span>No render yet</span></div>`}<div class="grad"></div>
     <div class="ttl"><div style="display:flex;gap:8px;margin-bottom:8px">${chipStage(p)}${tags(p)}</div><h2>${p.name}</h2><div style="font-size:14px;opacity:.9">${meta(p)}</div></div></div>
   <div class="bd">
     <div class="lbl" style="margin-bottom:8px">Journey</div>
     <div class="steps5" style="--c:${s.c}">${STEPS.map((n,i)=>`<div class="${s.step>=i?'f':''} ${s.step===i?'now':''}"><i></i>${n}${s.step===i?' · now':''}</div>`).join('')}</div>
     ${s.step<0?`<div class="chip slate" style="margin:-8px 0 16px">Closed as ${s.label}</div>`:''}
     ${p.next?`<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid ${p.next.k==='block'?'#fecdd3':p.next.k==='due'?'#fde68a':'var(--s200)'};background:${p.next.k==='block'?'#fff7f8':p.next.k==='due'?'#fffbeb':'var(--s50)'};margin-bottom:18px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px"><div class="lbl">Next step</div><div style="font-size:16px;font-weight:700">${p.next.t}</div><div class="help">Opens ${p.next.f} · designer ${p.own} · updated ${p.upd}</div></div>${nextBtn(p,false)}</div>`:''}
     <div class="lbl">Inside this project</div>
     <div class="fgrid">${FILES[p.stage].map(f=>`<div class="fcard" onclick="toast('Opens ${f[0]}')"><span class="ic">${ic('file',16)}</span><div><div style="font-weight:600;font-size:14px">${f[0]}</div><div class="help">${f[1]}</div></div></div>`).join('')}</div>
   </div>
   <div class="foot"><button class="btn p" onclick="toast('Opens the project')">Open project</button><button class="btn s" onclick="menu(event,${p.id})">Change stage</button><button class="btn s" onclick="toast('Cloned as template')">Clone as template</button></div>`;
  $('#peek').classList.add('on');$('#scrim').classList.add('on');
}
function closePeek(){$('#peek').classList.remove('on');$('#scrim').classList.remove('on')}

/* ··· menu (Open, files, Change stage, Clone as template, Select, Delete) */
function menu(e,id){
  closeMenu(); const p=P.find(x=>x.id===id);
  const m=document.createElement('div'); m.className='menu'; m.id='menu';
  m.innerHTML=`<button onclick="closeMenu();peek(${id})">Open</button>${FILES[p.stage].slice(0,3).map(f=>`<button onclick="closeMenu();toast('Opens ${f[0]}')">${f[0]}</button>`).join('')}<hr>
    <div class="lbl" style="padding:6px 10px 2px">Change stage</div>${ORDER.filter(k=>k!==p.stage).map(k=>`<button onclick="setStage(${id},'${k}')"><span class="sdot" style="background:${STAGE[k].c}"></span>${STAGE[k].label}</button>`).join('')}<hr>
    <button onclick="closeMenu();toast('Cloned as template')">Clone as template</button><button onclick="closeMenu();toast('Selected')">Select</button><button class="d" onclick="closeMenu();toast('Delete asks to confirm first')">Delete</button>`;
  document.body.appendChild(m);
  const r=e.target.getBoundingClientRect(); const mh=m.offsetHeight, mw=m.offsetWidth;
  m.style.left=Math.min(r.left,innerWidth-mw-10)+'px'; m.style.top=(r.bottom+mh+8>innerHeight?Math.max(10,r.top-mh-6):r.bottom+6)+'px';
  setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0);
}
function closeMenu(){const m=$('#menu');if(m)m.remove()}
function setStage(id,k){closeMenu();const p=P.find(x=>x.id===id);p.stage=k;toast(`${p.short} moved to ${STAGE[k].label}`);closePeek();render()}


/* ============ EVENTS ============ */
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){closePeek();closeMenu();return}
  if(e.key==='r'||e.key==='R'){go(0);return}
  if(/^[0-9]$/.test(e.key)){go(e.key==='0'?10:+e.key);return}
  if(st.v===5&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){triage(e.key==='ArrowRight'?1:-1);e.preventDefault()}
  if(st.v===0&&st.rmode==='overview'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){st.spot=Math.max(0,st.spot+(e.key==='ArrowRight'?1:-1));render()}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go(4)}});
render();

</script>
</body>
</html>
