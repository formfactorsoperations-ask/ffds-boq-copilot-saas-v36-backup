<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheStudioDesk · Projects — 10 concepts (round 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* StudioDesk tokens (DESIGN.md): Plus Jakarta Sans, brand #3D52A0, slate neutrals, rose/amber/emerald for state,
   stage colours approved for the Projects screen only (lib/projectFolders.ts). No amounts on this screen. */
:root{
  --brand:#3D52A0; --brandH:#334486; --brandT:rgba(61,82,160,.10);
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b; --s900:#0f172a;
  --rose:#e11d48; --rose7:#be123c; --rose1:#ffe4e6; --amber7:#b45309; --amber1:#fef3c7; --gold:#B8923A; --em7:#047857; --em1:#d1fae5;
  --lead:#0284c7; --proposal:#3D52A0; --won:#B8923A; --execution:#c2410c; --completed:#047857; --lost:#64748b; --terminated:#be123c;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:none} *::-webkit-scrollbar{display:none}
html,body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--s800);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:170px!important;background:
  radial-gradient(1200px 600px at 10% -10%,rgba(61,82,160,.10),transparent 60%),
  radial-gradient(900px 500px at 100% 0%,rgba(148,163,184,.18),transparent 60%),
  radial-gradient(circle at 1px 1px,rgba(100,116,139,.16) 1px,transparent 0) 0 0/22px 22px,#f5f7fb;min-height:100vh;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
.tnum{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--s500)}
.meta{font-size:12px;color:var(--s500)}
.help{font-size:11px;color:var(--s500)}

/* ---------- top bar (as the app) ---------- */
.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--s200);display:flex;align-items:center;gap:4px;padding:10px 22px;overflow-x:auto}
.logo{font-size:10px;font-weight:800;letter-spacing:.12em;border:1.5px solid var(--s700);padding:4px 8px;border-radius:6px;margin-right:14px;white-space:nowrap;color:var(--s700)}
.tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;font-weight:600;font-size:14px;color:var(--s700);white-space:nowrap}
.tab svg{color:var(--s400)}
.tab.on{background:linear-gradient(180deg,#4d62b4,var(--brand));color:#fff;box-shadow:0 6px 16px -6px rgba(61,82,160,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.tab.on svg{color:#fff}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--s500);flex:none}
.ib:hover{background:var(--s100)}
.who{display:flex;align-items:center;gap:10px;margin-left:8px;white-space:nowrap}
.who b{font-size:14px}
.sa{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--brandT);padding:3px 9px;border-radius:99px}
.av{width:36px;height:36px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}

.wrap{max-width:1380px;margin:0 auto;padding:22px 24px 0}
.title{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid rgba(203,213,225,.7);margin-bottom:14px}
.title h1{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--s800)}
.search{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--s300);background:#fff;min-width:240px;margin-left:auto}
.search input{border:0;outline:0;width:100%;font-size:14px;background:none}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,82,160,.18)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s,transform .15s,box-shadow .15s}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{background:var(--brandH)}
.btn.s{border:1px solid var(--s300);background:#fff;color:var(--s700)}.btn.s:hover{background:var(--s50)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.block{background:var(--rose);color:#fff}.btn.block:hover{background:var(--rose7)}
.btn.due{background:var(--gold);color:#fff}.btn.due:hover{background:#a07d2e}
.btn.go{background:var(--brand);color:#fff}.btn.go:hover{background:var(--brandH)}
.btn:active{transform:translateY(1px)}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.strip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--s200);border-radius:16px;padding:7px 8px 7px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--s200);background:#fff;white-space:nowrap;transition:all .15s}
.bchip.r{color:var(--rose7);border-color:#fecdd3;background:#fff7f8}
.bchip.a{color:var(--amber7);border-color:#fde68a;background:#fffbeb}
.bchip.on{box-shadow:0 0 0 3px rgba(225,29,72,.15)}
.bchip.a.on{box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--s100);gap:2px}
.seg button{padding:5px 12px;border-radius:9px;font-size:12px;font-weight:700;color:var(--s500);transition:all .2s var(--ease)}
.seg button.on{background:#fff;color:var(--s800);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.stages{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;border-bottom:1px solid rgba(226,232,240,.7);margin-bottom:18px}
.stg{flex:none;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:12px;font-size:14px;font-weight:600;color:var(--s600);border:1px solid transparent;transition:all .2s var(--ease)}
.stg:hover{background:rgba(255,255,255,.8)}
.stg.on{background:#fff;border-color:var(--s200);color:var(--s800);box-shadow:0 4px 14px -6px rgba(15,23,42,.18)}
.stg i{width:10px;height:10px;border-radius:3px;display:block}
.stg .c{font-size:12px;color:var(--s400);font-weight:700}

/* ---------- shared pieces ---------- */
.panel{background:#fff;border:1px solid var(--s200);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.55));backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px -12px rgba(15,23,42,.25),inset 0 1px 0 rgba(255,255,255,.9)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chip.brand{background:var(--brandT);color:var(--brand)} .chip.slate{background:var(--s100);color:var(--s600)}
.chip.good{background:var(--em1);color:var(--em7)} .chip.warn{background:var(--amber1);color:var(--amber7)} .chip.bad{background:var(--rose1);color:var(--rose7)}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ph{position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.55),transparent 55%),
  linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,#fff),color-mix(in srgb,var(--c) 55%,#e2e8f0))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),opacity .4s}
.ph .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:color-mix(in srgb,var(--c) 70%,#1e293b);font-size:11px;font-weight:700}
.ph .none svg{opacity:.7}
.own{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:var(--brand);flex:none;border:2px solid #fff}
.more{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--s500);flex:none}
.more:hover{background:var(--s100);color:var(--s800)}
.journey{display:flex;gap:3px;align-items:center}
.journey i{height:5px;flex:1;border-radius:9px;background:var(--s200);display:block}
.journey i.f{background:var(--c)}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 1px 2px rgba(15,23,42,.12),inset 0 1px 0 rgba(255,255,255,.8);background:linear-gradient(180deg,#fff,#f1f5f9);color:var(--brand)}
.tag.dummy{color:var(--amber7);background:linear-gradient(180deg,#fffbeb,#fef3c7)}
.tag.untagged{color:var(--rose7);background:linear-gradient(180deg,#fff1f2,#ffe4e6)}
.seal{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;transform:rotate(3deg);background:linear-gradient(180deg,#fff,#eef2ff);color:var(--s600);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.seal.pg{background:linear-gradient(180deg,#5a6fc0,var(--brand));color:#fff}
.empty{padding:48px;text-align:center}
.empty b{display:block;font-size:16px;color:var(--s800);margin-bottom:4px}

/* motion (mirrors hud-panel-in / hud-row-in / phd-pop; all off under reduced motion) */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.35)}50%{box-shadow:0 0 0 6px rgba(225,29,72,0)}}
@keyframes travel{from{background-position:0 0}to{background-position:-200px 0}}
.rise{animation:rise .45s var(--ease) both}
.swap{animation:fadein .25s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 1 · Ledger ---------- */
.lg-h{display:grid;grid-template-columns:minmax(300px,2.4fr) 1.2fr 1fr 1.3fr 40px;gap:16px;padding:12px 20px;border-bottom:1px solid var(--s100)}
.lg-grp{display:flex;align-items:center;gap:8px;padding:14px 20px 8px;font-size:12px;font-weight:700;color:var(--s600)}
.lg-r{display:grid;grid-template-columns:minmax(300px,2.4fr) 1.2fr 1fr 1.3fr 40px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--s100);cursor:pointer;transition:background .15s;position:relative}
.lg-r:hover{background:var(--s50)}
.lg-r .th{width:64px;height:48px;border-radius:12px;flex:none}
.lg-r:hover .th img{transform:scale(1.08)}
.lg-p{display:flex;gap:14px;align-items:center;min-width:0}
.lg-p .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files{display:flex;gap:6px;margin-top:6px;max-height:0;opacity:0;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s}
.lg-r:hover .files{max-height:40px;opacity:1}
.file{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--s700);background:#fff;border:1px solid var(--s200);border-radius:8px;padding:3px 8px;white-space:nowrap;transition:all .15s}
.file:hover{border-color:var(--brand);color:var(--brand)}
.file svg{color:var(--s400)}

/* ---------- 2 · Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(120px,auto);gap:14px}
.bt{padding:18px;border-radius:20px;position:relative;overflow:hidden}
.bt h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.bt h3 .n{margin-left:auto;font-size:24px;font-weight:900;color:var(--s800)}
.bt-need{grid-column:span 5;grid-row:span 3;background:linear-gradient(160deg,#fff,#fff6f7)}
.bt-site{grid-column:span 7;grid-row:span 2}
.bt-a{grid-column:span 4}
.bt-hand{grid-column:span 7}
.bt-closed{grid-column:span 5}
.nrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--s100);cursor:pointer}
.nrow:first-of-type{border-top:0}
.nrow .th{width:44px;height:44px;border-radius:12px;flex:none}
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:14px}
.sitecard{flex:0 0 200px;scroll-snap-align:start;cursor:pointer}
.sitecard .th{height:120px;border-radius:14px}
.sitecard:hover img{transform:scale(1.06)}
.mini{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--s100);cursor:pointer;font-size:14px;font-weight:600}
.mini:first-of-type{border-top:0}
.mini .th{width:34px;height:34px;border-radius:10px;flex:none}

/* ---------- 3 · Glass lanes ---------- */
.lanes{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;align-items:flex-start}
.lane{flex:0 0 268px;scroll-snap-align:start;border-radius:20px;padding:10px;min-height:420px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,rgba(255,255,255,.6)),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(10px);transition:box-shadow .2s}
.lane.over{box-shadow:0 0 0 2px var(--c) inset}
.lane-h{display:flex;align-items:center;gap:8px;padding:6px 6px 12px;font-weight:700;font-size:14px}
.lane-h .c{margin-left:auto;font-size:12px;color:var(--s500);background:#fff;border-radius:99px;padding:1px 9px}
.lcard{background:#fff;border:1px solid var(--s200);border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:grab;transition:transform .2s var(--ease),box-shadow .2s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(15,23,42,.25)}
.lcard.drag{opacity:.4}
.lcard .th{height:110px}
.lcard .b{padding:12px}

/* ---------- 4 · Studio index ---------- */
.idx{position:relative}
.ix-r{display:grid;grid-template-columns:56px 1fr 220px 150px 230px;gap:20px;align-items:center;padding:16px 4px;border-top:1px solid var(--s200);cursor:pointer;transition:opacity .3s,color .3s}
.ix-r:last-child{border-bottom:1px solid var(--s200)}
.ix-r .no{font-size:12px;font-weight:700;color:var(--s400)}
.ix-r .nm{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1;transition:transform .35s var(--ease),color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx.hov .ix-r{opacity:.35}
.idx.hov .ix-r.on{opacity:1}
.idx.hov .ix-r.on .nm{transform:translateX(12px);color:var(--c)}
.ix-r .mth{display:none;width:64px;height:48px;border-radius:12px}
.follow{position:fixed;left:0;top:0;width:340px;height:230px;border-radius:20px;pointer-events:none;z-index:40;opacity:0;transform:scale(.9);transition:opacity .25s,transform .35s var(--ease);box-shadow:0 30px 60px -20px rgba(15,23,42,.45)}
.follow.on{opacity:1;transform:scale(1)}
.follow .cap{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;font-size:12px;font-weight:700}

/* ---------- 5 · Cover flow ---------- */
.cf{position:relative;height:470px;perspective:1600px;overflow:hidden;touch-action:pan-y}
.cf-c{position:absolute;left:50%;top:20px;width:560px;height:380px;margin-left:-280px;border-radius:26px;transition:transform .6s var(--ease),opacity .5s,filter .5s;cursor:pointer;transform-style:preserve-3d}
.cf-c .th{position:absolute;inset:0;border-radius:26px;box-shadow:0 40px 70px -30px rgba(15,23,42,.5)}
.cf-c .plate{position:absolute;left:16px;right:16px;bottom:16px;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:opacity .4s}
.cf-c:not(.act) .plate{opacity:0}
.cf-c .refl{position:absolute;left:0;right:0;top:100%;height:80px;border-radius:26px;transform:scaleY(-1);opacity:.18;overflow:hidden;filter:blur(2px);-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%)}
.cf-nav{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:30;margin-top:-40px}
.cf-strip{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:6px 0}
.cf-dot{flex:none;width:56px;height:40px;border-radius:10px;opacity:.55;transition:all .3s var(--ease);outline:2px solid transparent;outline-offset:2px}
.cf-dot.on{opacity:1;outline-color:var(--brand);width:72px}

/* ---------- 6 · Wallet ---------- */
.wallets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 22px}
.wst h4{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:12px}
.wst h4 .c{color:var(--s400);font-size:12px}
.stack{position:relative;transition:height .45s var(--ease)}
.pass{position:absolute;left:0;right:0;height:232px;border-radius:22px;overflow:hidden;cursor:pointer;transition:top .45s var(--ease),transform .3s var(--ease),box-shadow .3s;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 75%,#0f172a));box-shadow:0 -1px 0 rgba(255,255,255,.4) inset,0 12px 28px -14px rgba(15,23,42,.45)}
.pass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);pointer-events:none}
.stack:not(.exp) .pass:hover{transform:translateY(-8px)}
.pass .ph-h{display:flex;align-items:center;gap:10px;padding:14px 16px;height:56px}
.pass .ph-h b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pass .ph-h span{margin-left:auto;font-size:11px;opacity:.85;white-space:nowrap}
.pass .pb{display:flex;gap:12px;padding:0 16px}
.pass .pb .th{width:120px;height:96px;border-radius:14px;flex:none;border:2px solid rgba(255,255,255,.4)}
.pass .pf{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:8px}
.pass .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pass .v{font-size:14px;font-weight:700}
.pass .btn{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pass .notch{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#f5f7fb;margin-top:-9px}

/* ---------- 7 · Journey line ---------- */
.jl{padding:26px 26px 18px;overflow-x:auto}
.jl-g{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));min-width:780px;position:relative}
.jl-tok{display:flex;flex-wrap:wrap-reverse;gap:8px;justify-content:center;align-content:flex-start;min-height:120px;padding:0 10px 18px}
.tok{width:46px;height:46px;border-radius:50%;position:relative;cursor:pointer;transition:transform .25s var(--ease);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c),0 8px 18px -8px rgba(15,23,42,.5)}
.tok .ph{width:100%;height:100%;border-radius:50%}
.tok:hover{transform:translateY(-4px) scale(1.08);z-index:3}
.tok .flag{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.tok .flag.block{background:var(--rose);animation:breathe 2s infinite}
.tok .flag.due{background:var(--gold)}
.jl-line{grid-column:1/-1;height:10px;border-radius:9px;margin:0 9%;background:linear-gradient(90deg,var(--lead),var(--proposal),var(--won),var(--execution),var(--completed));position:relative;overflow:hidden}
.jl-line::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.45) 60px 100px,transparent 100px 200px);animation:travel 3s linear infinite}
.jl-st{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:0;margin-top:-17px;cursor:pointer}
.jl-st .ring{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--c);transition:transform .25s var(--ease);position:relative;z-index:2}
.jl-st:hover .ring,.jl-st.on .ring{transform:scale(1.25)}
.jl-st b{font-size:14px;font-weight:700}
.jl-st.on b{color:var(--c)}
.siding{display:flex;align-items:center;gap:12px;margin:22px 0 0;padding:12px 16px;border-radius:14px;background:var(--s50);border:1px dashed var(--s300)}

/* ---------- 8 · Spotlight + shelves ---------- */
.spot{display:grid;grid-template-columns:1.55fr 1fr;border-radius:26px;overflow:hidden;min-height:340px;margin-bottom:26px;position:relative}

 {n:'Journey line',k:'bold',why:'Transit-map line of the 5 stages, projects as tokens; red pulse = blocker.'},
 {n:'Spotlight + shelves',k:'prac',why:'Apple TV app: the most urgent project up top, a shelf per stage below.'},
 {n:'Moodboard',k:'bold',why:'Cosmos/Pinterest masonry of renders; hover lights up every image of that project.'},
 {n:'Departures board',k:'bold',why:'Split-flap airport board: On time, Boarding (due), Delayed (blocker), Landed.'}
];

/* ============ STATE ============ */
let st = {v:0,stage:'all',kind:'all',q:'',need:null,cf:0,spot:0,wexp:null,jl:'execution'};
try{const s=+localStorage.getItem('sd_concept');if(s>=0&&s<10)st.v=s}catch(e){}
let timers=[];

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const S=p=>STAGE[p.stage];
const iurl=(i,w)=>`https://images.unsplash.com/photo-${IMGS[i]}?w=${w}&q=70&auto=format&fit=crop`;
const ICON={
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  pencil:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
  ruler:'<path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0l-4.6-4.6a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4zM7.5 10.5l2 2M10.5 7.5l2 2M13.5 4.5l2 2M4.5 13.5l2 2"/>'
};
const ic=(n,s=16,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
function th(p,w=600,cls='th',idx=0,style='',eager=false){
  const has=p.imgs.length>0; const i=p.imgs[idx%Math.max(p.imgs.length,1)];
  return `<div class="ph ${cls}" style="--c:${S(p).c};${style}">${has?`<img ${eager?'':'loading="lazy"'} src="${iurl(i,w)}" alt="" onerror="this.remove()">`:`<div class="none">${ic('ruler',22)}<span>No render yet</span></div>`}</div>`;
}
const chipStage=p=>`<span class="chip" style="background:color-mix(in srgb,${S(p).c} 14%,#fff);color:${S(p).c}"><span class="sdot" style="background:${S(p).c}"></span>${S(p).label}</span>`;
const tags=p=>`<span class="tag ${p.tag}">${{actual:'Actual',dummy:'Dummy',untagged:'Untagged'}[p.tag]}</span> <span class="seal ${p.boq==='Playground'?'pg':''}">${p.boq==='No BOQ'?'No BOQ yet':p.boq+' BOQ'}</span>`;
const own=o=>`<span class="own" style="background:${OWN[o]}" title="Designer ${o}">${o}</span>`;
const journey=p=>`<div class="journey" style="--c:${S(p).c}">${FLOW.map((s,i)=>`<i class="${S(p).step>=i?'f':''}"></i>`).join('')}</div>`;
const nextBtn=(p,sm=true)=>p.next?`<button class="btn ${p.next.k} ${sm?'sm':''}" onclick="event.stopPropagation();doStep(${p.id})">${p.next.k==='block'?ic('alert',14):''}${p.next.t}</button>`:`<span class="help">Nothing pending</span>`;
const moreBtn=p=>`<button class="more" onclick="event.stopPropagation();menu(event,${p.id})" aria-label="More">${ic('more',18)}</button>`;
const meta=p=>`${p.client} · ${p.kind} · ${p.sft.toLocaleString('en-IN')} sft · ${p.loc}`;

function list(){
  const q=st.q.toLowerCase();
  return P.filter(p=>(st.stage==='all'||p.stage===st.stage)&&(st.kind==='all'||p.tag===st.kind)
    &&(!st.need||(p.next&&p.next.k===st.need))&&(!q||(p.name+p.client+p.loc+p.kind).toLowerCase().includes(q)));
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900)}
function doStep(id){const p=P.find(x=>x.id===id);toast(`${p.next.t} → opens ${p.next.f}`)}

/* ============ SHELL ============ */
function shell(){
  const base=P.filter(p=>st.kind==='all'||p.tag===st.kind);
  const nb=base.filter(p=>p.next&&p.next.k==='block').length, nd=base.filter(p=>p.next&&p.next.k==='due').length;
  $('#needs').innerHTML=`<button class="bchip r ${st.need==='block'?'on':''}" onclick="st.need=st.need==='block'?null:'block';render()">${nb} blockers</button><button class="bchip a ${st.need==='due'?'on':''}" onclick="st.need=st.need==='due'?null:'due';render()">${nd} due this week</button>`;
  $('#kinds').innerHTML=[['all','All'],['actual','Actual'],['dummy','Dummy']].map(([k,l])=>`<button class="${st.kind===k?'on':''}" onclick="st.kind='${k}';render()">${l}</button>`).join('');
  const cnt=k=>base.filter(p=>p.stage===k).length;
  $('#stages').innerHTML=`<button class="stg ${st.stage==='all'?'on':''}" onclick="st.stage='all';render()">All projects <span class="c">${base.length}</span></button>`+
    ORDER.map(k=>`<button class="stg ${st.stage===k?'on':''}" onclick="st.stage='${k}';render()"><i style="background:${STAGE[k].c}"></i>${STAGE[k].label} <span class="c">${cnt(k)}</span></button>`).join('');
  $('#dock').innerHTML=C.map((c,i)=>`<button class="dk ${i===st.v?'on':''}" onclick="go(${i})"><span class="n">${i===9?0:i+1}</span>${c.n}${c.k==='bold'?'<span class="bd" title="Bold"></span>':''}</button>`).join('');
  $('#dpos').textContent=(st.v+1)+' of 10 ·';$('#dname').textContent=C[st.v].n; const dk=$('#dkind'); dk.className='kind '+(C[st.v].k==='bold'?'bold':'prac'); dk.textContent=C[st.v].k==='bold'?'Bold':'Practical';
  $('#dwhy').textContent=C[st.v].why;
  const on=document.querySelector('.dk.on'); if(on) on.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
}
function go(i){st.v=i;try{localStorage.setItem('sd_concept',i)}catch(e){};render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
  timers.forEach(clearInterval);timers=[];$('#follow').classList.remove('on');
  shell(); const el=$('#view'); el.className='swap'; void el.offsetWidth;
  const ls=list();
  if(!ls.length && ![1,6].includes(st.v)){el.innerHTML=`<div class="panel empty"><b>No projects here</b><span class="meta">Try another stage or clear the search.</span></div>`;return}
  V[st.v](el,ls);
}

/* ============ VIEWS ============ */
const V=[];

/* 1 · Studio ledger */
V[0]=(el,ls)=>{
  const groups=st.stage==='all'?ORDER:[st.stage]; let i=0;
  el.innerHTML=`<div class="panel rise" style="overflow:hidden">
   <div class="lg-h"><span class="lbl">Project</span><span class="lbl c2">Journey</span><span class="lbl c3">Tags</span><span class="lbl c4">Next step</span><span></span></div>
   ${groups.map(k=>{const items=ls.filter(p=>p.stage===k);if(!items.length)return'';
     return `<div class="lg-grp"><span class="sdot" style="background:${STAGE[k].c}"></span>${STAGE[k].label}<span style="color:var(--s400)">${items.length}</span></div>`+
     items.map(p=>`<div class="lg-r rise" style="animation-delay:${(i++)*30}ms" onclick="peek(${p.id})">
       <div class="lg-p">${th(p,200)}<div style="min-width:0"><div class="t">${p.name}</div><div class="meta">${meta(p)}</div>
         <div class="files">${FILES[p.stage].map(f=>`<button class="file" onclick="event.stopPropagation();toast('Opens ${f[0]}')">${ic('file',12)}${f[0]}</button>`).join('')}</div></div></div>
       <div class="c2">${journey(p)}<div class="help" style="margin-top:6px">${S(p).step>=0?STEPS[S(p).step]:S(p).label} · ${p.upd}</div></div>
       <div class="c3">${tags(p)}</div>
       <div class="c4" style="display:flex;align-items:center;gap:8px">${nextBtn(p)}</div>
       <div>${moreBtn(p)}</div></div>`).join('')}).join('')}
  </div>`;
};

/* 2 · Bento board */
V[1]=(el,ls)=>{
  const by=k=>ls.filter(p=>p.stage===k);
  const needs=ls.filter(p=>p.next&&p.next.k!=='go').sort((a,b)=>(a.next.k==='block'?0:1)-(b.next.k==='block'?0:1));
  const miniList=(arr,empty)=>arr.length?arr.map(p=>`<div class="mini" onclick="peek(${p.id})">${th(p,120)}<div style="min-width:0;flex:1"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.short}</div><div class="help">${p.client}</div></div>${p.next?`<span class="sdot" style="background:${p.next.k==='block'?'var(--rose)':p.next.k==='due'?'var(--gold)':'var(--brand)'}"></span>`:''}</div>`).join(''):`<div class="help" style="padding:8px 0">${empty}</div>`;
  const tile=(cls,title,c,count,body,i)=>`<div class="bt panel ${cls} rise" style="animation-delay:${i*50}ms"><h3><span class="sdot" style="background:${c}"></span>${title}<span class="n tnum">${count}</span></h3>${body}</div>`;
  el.innerHTML=`<div class="bento">
   ${tile('bt-need','Needs you','var(--rose)',needs.length,`<div class="help" style="margin:2px 0 10px">Blockers first, then what is due this week.</div>`+(needs.length?needs.map(p=>`<div class="nrow" onclick="peek(${p.id})">${th(p,120)}<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${p.next.t}</div><div class="help">${p.short} · ${p.client}</div></div>${nextBtn({...p,next:{...p.next,t:p.next.k==='block'?'Fix':'Do'}})}</div>`).join(''):'<div class="help">Nothing blocked or due. Good day.</div>'),0)}
   ${tile('bt-site','On site',STAGE.execution.c,by('execution').length,`<div class="hrow">${by('execution').map(p=>`<div class="sitecard" onclick="peek(${p.id})">${th(p,400)}<div style="font-weight:700;font-size:14px;margin-top:8px">${p.short}</div><div class="help">${p.next?p.next.t:'On track'}</div></div>`).join('')||'<div class="help">No site running.</div>'}</div>`,1)}
   ${tile('bt-a','Won · to start',STAGE.won.c,by('won').length,miniList(by('won'),'None waiting.'),2)}
   ${tile('bt-a','Proposals out',STAGE.proposal.c,by('proposal').length,miniList(by('proposal'),'No proposal out.'),3)}
   ${tile('bt-a','New leads',STAGE.lead.c,by('lead').length,miniList(by('lead'),'No new lead.'),4)}
   ${tile('bt-hand','Handed over',STAGE.completed.c,by('completed').length,`<div class="hrow">${by('completed').map(p=>`<div class="sitecard" onclick="peek(${p.id})">${th(p,400)}<div style="font-weight:700;font-size:14px;margin-top:8px">${p.short}</div><div class="help">${p.client}</div></div>`).join('')||'<div class="help">None yet.</div>'}</div>`,5)}
   ${tile('bt-closed','Closed',STAGE.lost.c,by('lost').length+by('terminated').length,miniList([...by('lost'),...by('terminated')],'Nothing closed.'),6)}
  </div>`;
};

/* 3 · Glass lanes */
V[2]=(el,ls)=>{
  const lanes=st.stage==='all'?ORDER:[st.stage];
  el.innerHTML=`<div class="lanes">${lanes.map((k,li)=>{const items=ls.filter(p=>p.stage===k);
    return `<div class="lane rise" style="--c:${STAGE[k].c};animation-delay:${li*50}ms" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropTo(event,'${k}')">
      <div class="lane-h"><span class="sdot" style="background:${STAGE[k].c}"></span>${STAGE[k].label}<span class="c">${items.length}</span></div>
      ${items.map(p=>`<div class="lcard" draggable="true" ondragstart="event.dataTransfer.setData('id',${p.id});this.classList.add('drag')" ondragend="this.classList.remove('drag')" onclick="peek(${p.id})">
        ${th(p,500)}<div class="b"><div style="display:flex;gap:6px;margin-bottom:8px">${tags(p)}</div><div style="font-weight:700">${p.short}</div><div class="help" style="margin-bottom:10px">${p.client} · ${p.kind}</div>
        <div style="display:flex;align-items:center;gap:8px">${p.next?nextBtn(p):'<span class="help">Nothing pending</span>'}<span class="sp"></span>${own(p.own)}</div></div></div>`).join('')||'<div class="help" style="padding:10px">Drop a project here</div>'}
    </div>`}).join('')}</div><div class="help" style="margin-top:8px">Drag a card to another lane to change its stage.</div>`;
};
function dropTo(e,k){e.preventDefault();const p=P.find(x=>x.id==e.dataTransfer.getData('id'));if(p&&p.stage!==k){p.stage=k;toast(`${p.short} moved to ${STAGE[k].label}`);render()}}

/* 4 · Studio index */
V[3]=(el,ls)=>{
  el.innerHTML=`<div class="idx" id="idx">${ls.map((p,i)=>`<div class="ix-r rise" style="--c:${S(p).c};animation-delay:${i*30}ms" data-id="${p.id}" onclick="peek(${p.id})">
    <span class="no tnum">${String(p.id).padStart(2,'0')}</span>
    <div style="display:flex;align-items:center;gap:14px;min-width:0">${th(p,160,'mth')}<div style="min-width:0"><div class="nm">${p.short}</div><div class="meta">${p.client} · ${p.kind} · ${p.loc}</div></div></div>
    <div class="c3">${chipStage(p)}<div style="margin-top:8px">${journey(p)}</div></div>
    <div class="c4">${tags(p)}</div>
    <div class="c5" style="display:flex;justify-content:flex-end">${nextBtn(p)}</div></div>`).join('')}</div>`;
  const idx=$('#idx'),f=$('#follow'); let tx=0,ty=0,x=0,y=0,raf;
  const loop=()=>{x+=(tx-x)*.16;y+=(ty-y)*.16;f.style.transform=`translate(${x}px,${y}px) rotate(${(tx-x)*.03}deg)`;raf=requestAnimationFrame(loop)};
  idx.querySelectorAll('.ix-r').forEach(r=>{
    r.addEventListener('mouseenter',()=>{const p=P.find(q=>q.id==r.dataset.id);idx.classList.add('hov');r.classList.add('on');
      f.style.setProperty('--c',S(p).c);f.innerHTML=(p.imgs.length?`<img src="${iurl(p.imgs[0],700)}" alt="" onerror="this.remove()">`:`<div class="none">${ic('ruler',26)}<span>No render yet</span></div>`)+`<div class="cap glass">${chipStage(p)}<span>${p.next?p.next.t:'Nothing pending'}</span></div>`;f.classList.add('on')});
    r.addEventListener('mouseleave',()=>{idx.classList.remove('hov');r.classList.remove('on');f.classList.remove('on')});
  });
  idx.addEventListener('mousemove',e=>{tx=e.clientX+24;ty=e.clientY-120;if(!raf)loop()});
  timers.push(setInterval(()=>{},1e9)); window._stopFollow=()=>{cancelAnimationFrame(raf);raf=null};
};

/* 5 · Cover flow */
V[4]=(el,ls)=>{
  st.cf=Math.min(st.cf,ls.length-1);
  el.innerHTML=`<div class="cf" id="cf">${ls.map((p,i)=>`<div class="cf-c" data-i="${i}" onclick="cfClick(${i},${p.id})">${th(p,1000,'th',0,'',true)}<div class="refl">${th(p,500,'th',0,'',true)}</div>
     <div class="plate glass"><div style="flex:1;min-width:0"><div style="display:flex;gap:8px;margin-bottom:6px">${chipStage(p)}${tags(p)}</div><div style="font-size:20px;font-weight:800;letter-spacing:-.02em">${p.short}</div><div class="meta">${meta(p)}</div></div>${nextBtn(p,false)}</div></div>`).join('')}
     <button class="cf-nav glass" style="left:16px" onclick="cfMove(-1)">${ic('left',18)}</button><button class="cf-nav glass" style="right:16px" onclick="cfMove(1)">${ic('right',18)}</button></div>
   <div class="cf-strip" id="cfs">${ls.map((p,i)=>`<button class="cf-dot ph" style="--c:${S(p).c}" onclick="st.cf=${i};cfLayout()">${p.imgs.length?`<img src="${iurl(p.imgs[0],160)}" alt="" onerror="this.remove()">`:''}</button>`).join('')}</div>
   <div class="help" style="text-align:center;margin-top:6px">← → keys, swipe or scroll sideways. Click the front card to open it.</div>`;
  cfLayout();
  const cf=$('#cf'); let sx=null;
  cf.addEventListener('pointerdown',e=>sx=e.clientX);
  cf.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>40){cfMove(e.clientX<sx?1:-1)}sx=null});
  cf.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>12){e.preventDefault();if(!cf._w){cfMove(e.deltaX>0?1:-1);cf._w=1;setTimeout(()=>cf._w=0,350)}}},{passive:false});
};
function cfLayout(){
  const cards=document.querySelectorAll('.cf-c'); const mob=innerWidth<760;
  cards.forEach(c=>{const o=+c.dataset.i-st.cf, a=Math.abs(o);
    const tx=o===0?0:Math.sign(o)*((mob?150:300)+(a-1)*(mob?40:110));
    c.style.transform=`translateX(${tx}px) translateZ(${o===0?0:-220-a*30}px) rotateY(${o===0?0:-Math.sign(o)*48}deg)`;
    c.style.zIndex=100-a; c.style.opacity=a>4?0:1; c.style.filter=o===0?'none':`brightness(${1-a*.08})`;
    c.classList.toggle('act',o===0)});
  document.querySelectorAll('.cf-dot').forEach((d,i)=>d.classList.toggle('on',i===st.cf));
  const on=document.querySelector('.cf-dot.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function cfMove(d){const n=document.querySelectorAll('.cf-c').length;st.cf=Math.max(0,Math.min(n-1,st.cf+d));cfLayout()}
function cfClick(i,id){if(i===st.cf)peek(id);else{st.cf=i;cfLayout()}}

/* 6 · Wallet passes */
V[5]=(el,ls)=>{
  const groups=ORDER.filter(k=>ls.some(p=>p.stage===k));
  el.innerHTML=`<div class="wallets">${groups.map((k,gi)=>{const items=ls.filter(p=>p.stage===k);
    return `<div class="wst rise" style="animation-delay:${gi*60}ms"><h4><span class="sdot" style="background:${STAGE[k].c}"></span>${STAGE[k].label}<span class="c">${items.length}</span></h4>
     <div class="stack" data-k="${k}">${items.map((p,i)=>`<div class="pass" style="--c:${S(p).c}" data-id="${p.id}" data-i="${i}" onclick="wClick(${p.id})">
       <div class="ph-h">${p.next&&p.next.k==='block'?'<span class="sdot" style="background:#fff;box-shadow:0 0 0 3px rgba(225,29,72,.9)"></span>':''}<b>${p.short}</b><span>${p.kind} · ${p.loc}</span></div>
       <span class="notch" style="left:-9px"></span><span class="notch" style="right:-9px"></span>
       <div class="pb">${th(p,300)}<div style="min-width:0"><div class="k">Client</div><div class="v" style="margin-bottom:6px">${p.client}</div><div class="k">Journey</div><div class="v">${S(p).step>=0?STEPS[S(p).step]+' · step '+(S(p).step+1)+' of 5':S(p).label}</div></div></div>
       <div class="pf">${p.next?`<button class="btn sm" style="background:#fff;color:${p.next.k==='block'?'var(--rose7)':'var(--s800)'}" onclick="event.stopPropagation();doStep(${p.id})">${p.next.t}</button>`:'<span class="k">Nothing pending</span>'}<span class="sp"></span><button class="btn sm" style="background:rgba(255,255,255,.18);color:#fff" onclick="event.stopPropagation();peek(${p.id})">Open</button></div>
     </div>`).join('')}</div></div>`}).join('')}</div>
   <div class="help" style="margin-top:14px">Click a pass to pull it out of its stack; click it again to put it back.</div>`;
  wLayout();
};
function wClick(id){st.wexp=st.wexp===id?null:id;wLayout()}
function wLayout(){
  document.querySelectorAll('.stack').forEach(s=>{
    const ps=[...s.querySelectorAll('.pass')]; const n=ps.length; const ei=ps.findIndex(p=>+p.dataset.id===st.wexp);
    ps.forEach((p,i)=>{let top=i*56; if(ei>=0&&i>ei) top+=176; p.style.top=top+'px'; p.style.zIndex=i});
    s.classList.toggle('exp',ei>=0);
    s.style.height=((n-1)*56+232+(ei>=0&&ei<n-1?176:0))+'px';
  });
}

/* 7 · Journey line */
V[6]=(el,ls)=>{
  const sel=ls.filter(p=>p.stage===st.jl);
  const closed=ls.filter(p=>['lost','terminated'].includes(p.stage));
  const tok=p=>`<div class="tok" style="--c:${S(p).c}" title="${p.short} · ${p.next?p.next.t:'nothing pending'}" onclick="peek(${p.id})">${th(p,120)}${p.next&&p.next.k!=='go'?`<span class="flag ${p.next.k}"></span>`:''}</div>`;
  el.innerHTML=`<div class="panel jl rise"><div class="jl-g">
     ${FLOW.map(k=>`<div class="jl-tok">${ls.filter(p=>p.stage===k).map(tok).join('')}</div>`).join('')}
     <div class="jl-line"></div>
     ${FLOW.map(k=>`<div class="jl-st ${st.jl===k?'on':''}" style="--c:${STAGE[k].c}" onclick="st.jl='${k}';render()"><span class="ring"></span><b>${STAGE[k].label}</b><span class="help">${ls.filter(p=>p.stage===k).length} projects</span></div>`).join('')}
   </div>
   <div class="siding"><span class="lbl">Siding</span>${closed.map(p=>`<div class="tok" style="--c:${S(p).c};width:34px;height:34px" title="${p.short} · ${S(p).label}" onclick="peek(${p.id})">${th(p,80)}</div>`).join('')||'<span class="help">Nothing lost or terminated</span>'}<span class="help" style="margin-left:auto">Lost and terminated projects leave the line here.</span></div></div>
   <div class="panel" style="margin-top:16px;overflow:hidden"><div class="lg-grp" style="padding-bottom:10px"><span class="sdot" style="background:${STAGE[st.jl].c}"></span>At ${STAGE[st.jl].label}<span style="color:var(--s400)">${sel.length}</span><span class="help" style="margin-left:auto;font-weight:500">Click a station to change</span></div>
   ${sel.map((p,i)=>`<div class="lg-r rise" style="animation-delay:${i*30}ms;grid-template-columns:minmax(260px,2fr) 1fr 1.3fr 40px" onclick="peek(${p.id})"><div class="lg-p">${th(p,200)}<div style="min-width:0"><div class="t">${p.name}</div><div class="meta">${meta(p)}</div></div></div><div class="c3">${tags(p)}</div><div class="c4">${nextBtn(p)}</div><div>${moreBtn(p)}</div></div>`).join('')||'<div class="empty"><span class="meta">No project at this station.</span></div>'}</div>`;
};

/* 8 · Spotlight + shelves */
V[7]=(el,ls)=>{
  const urgent=ls.filter(p=>p.next).sort((a,b)=>({block:0,due:1,go:2}[a.next.k])-({block:0,due:1,go:2}[b.next.k])).slice(0,4);
  st.spot=Math.min(st.spot,Math.max(urgent.length-1,0)); const h=urgent[st.spot];
  const shelves=ORDER.filter(k=>ls.some(p=>p.stage===k));
  el.innerHTML=(h?`<div class="spot panel rise">${th(h,1400)}<div class="side">
      <span class="lbl" style="color:${h.next.k==='block'?'var(--rose7)':h.next.k==='due'?'var(--amber7)':'var(--brand)'}">${h.next.k==='block'?'Blocked · needs you first':h.next.k==='due'?'Due this week':'Up next'}</span>
      <h2>${h.name}</h2><div class="meta">${meta(h)}</div><div style="display:flex;gap:6px">${chipStage(h)}${tags(h)}</div>
      <div style="margin:8px 0 2px">${journey(h)}</div>
      <div style="font-size:16px;font-weight:700;margin-top:10px">${h.next.t}</div><div class="help">Opens ${h.next.f}. Owner ${h.own}, updated ${h.upd}.</div>
      <div style="display:flex;gap:8px;margin-top:8px">${nextBtn(h,false)}<button class="btn s" onclick="peek(${h.id})">Open project</button></div>
      <div class="spdots">${urgent.map((u,i)=>`<button class="${i===st.spot?'on':''}" onclick="st.spot=${i};render()" aria-label="${u.short}"></button>`).join('')}</div></div></div>`:'')+
    shelves.map((k,si)=>{const items=ls.filter(p=>p.stage===k);return `<div class="shelf rise" style="animation-delay:${si*60}ms"><div class="shelf-h"><span class="sdot" style="background:${STAGE[k].c}"></span><h3>${STAGE[k].label}</h3><span class="help">${items.length}</span>
      <div class="ar"><button onclick="this.closest('.shelf').querySelector('.row').scrollBy({left:-520})">${ic('left',16)}</button><button onclick="this.closest('.shelf').querySelector('.row').scrollBy({left:520})">${ic('right',16)}</button></div></div>
      <div class="row">${items.map(p=>`<div class="scard" onclick="peek(${p.id})">${th(p,500)}<div class="t">${p.short}</div><div class="help" style="margin-bottom:6px">${p.client} · ${p.kind}</div>${p.next?`<span class="chip ${p.next.k==='block'?'bad':p.next.k==='due'?'warn':'brand'}">${p.next.t}</span>`:''}</div>`).join('')}</div></div>`}).join('');
};

/* 9 · Moodboard */
V[8]=(el,ls)=>{
  const H=[220,300,180,260,340,200];
  const tiles=[];
  ls.forEach((p,pi)=>{
    if(!p.imgs.length) tiles.push({p,note:true});
    else p.imgs.forEach((im,j)=>tiles.push({p,j,h:H[(pi*2+j)%H.length]}));
  });
  /* interleave so a project's images spread across the board */
  tiles.sort((a,b)=>((a.j||0)-(b.j||0))||a.p.id-b.p.id);
  el.innerHTML=`<div class="mood" id="mood">${tiles.map((t,i)=>t.note?
    `<div class="mt note rise" data-p="${t.p.id}" style="animation-delay:${i*25}ms" onclick="peek(${t.p.id})"><span class="corner" style="background:${S(t.p).c};position:static;display:inline-block;vertical-align:middle;margin-right:6px"></span><span class="lbl">${S(t.p).label}</span><div style="font-weight:800;font-size:20px;letter-spacing:-.02em;margin:8px 0 2px">${t.p.short}</div><div class="meta">${t.p.client} · ${t.p.kind}</div><div style="margin:10px 0">${tags(t.p)}</div>${nextBtn(t.p)}</div>`:
    `<div class="mt rise" data-p="${t.p.id}" style="animation-delay:${i*25}ms" onclick="peek(${t.p.id})">${th(t.p,600,'th',t.j,`height:${t.h}px`)}<span class="corner" style="background:${S(t.p).c}"></span>
      <div class="lab glass"><b style="font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.p.short}</b>${t.p.next?`<span class="sdot" style="background:${t.p.next.k==='block'?'var(--rose)':t.p.next.k==='due'?'var(--gold)':'var(--brand)'}"></span>`:''}<span class="help">${S(t.p).label}</span></div></div>`).join('')}</div>`;
  const mood=$('#mood');
  mood.querySelectorAll('.mt').forEach(t=>{
    t.addEventListener('mouseenter',()=>{mood.classList.add('hov');mood.querySelectorAll(`.mt[data-p="${t.dataset.p}"]`).forEach(x=>x.classList.add('on'))});
    t.addEventListener('mouseleave',()=>{mood.classList.remove('hov');mood.querySelectorAll('.mt.on').forEach(x=>x.classList.remove('on'))});
  });
};

/* 10 · Departures board */
const STATUS=p=>{
  if(p.stage==='lost')return['CANCELLED','#475569','#e2e8f0'];
  if(p.stage==='terminated')return['TERMINATED','#be123c','#ffe4e6'];
  if(p.stage==='completed')return['LANDED','#047857','#d1fae5'];
  if(p.next&&p.next.k==='block')return['DELAYED','#e11d48','#fff'];
  if(p.next&&p.next.k==='due')return['BOARDING','#B8923A','#fff'];
  return['ON TIME','#334155','#d1fae5'];
};
V[9]=(el,ls)=>{
  const flaps=(s,n)=>{s=s.toUpperCase().slice(0,n).padEnd(n,' ');return `<span class="flaps" data-f="${s}">${[...s].map(ch=>`<span class="fl ${ch===' '?'sp':''}">${ch===' '?'':ch}</span>`).join('')}</span>`};
  el.innerHTML=`<div class="dep rise"><div class="dep-h"><h3>PROJECTS · DEPARTURES</h3><span class="help" style="color:#94a3b8">Form Factors Design Studio</span><span class="sp"></span><span id="clock" class="tnum" style="font-size:20px;font-weight:800;color:#fde68a"></span></div>
   <div class="dep-g"><div class="dep-r hd"><span>UPDATED</span><span>PROJECT</span><span>CLIENT</span><span>GATE</span><span>NEXT STEP</span><span>STATUS</span></div>
   ${ls.map(p=>{const [s,bg,fg]=STATUS(p);return `<div class="dep-r" onclick="peek(${p.id})"><span class="tnum" style="font-weight:700;color:#cbd5e1">${p.upd.toUpperCase()}</span>${flaps(p.short,17)}<span style="font-size:14px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.client}</span>
     <span style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#fff"><span class="sdot" style="background:${S(p).c};box-shadow:0 0 10px ${S(p).c}"></span>${S(p).label}</span>
     <span style="font-size:14px;color:${p.next?'#f8fafc':'#64748b'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.next?p.next.t:'—'}</span>
     <span class="st-s" style="background:${bg};color:${fg}">${s}</span></div>`}).join('')}</div></div>
   <div class="help" style="margin-top:10px">Delayed = blocked · Boarding = due this week · Landed = handed over. The board flips in each time it opens.</div>`;
  const clock=()=>{const c=$('#clock');if(c)c.textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false})};
  clock(); timers.push(setInterval(clock,10000));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  document.querySelectorAll('.flaps').forEach((f,ri)=>{
    const fin=f.dataset.f; const cells=[...f.children]; let t=0; const stop=5+ri;
    const id=setInterval(()=>{t++;cells.forEach((c,ci)=>{if(fin[ci]===' ')return;c.textContent=t>=stop+ci*0.6?fin[ci]:A[(Math.random()*A.length)|0]});if(t>stop+fin.length)clearInterval(id)},38);
    timers.push(id);
  });
};

/* ============ PEEK (one click opens the project) ============ */
function peek(id){
  const p=P.find(x=>x.id===id); const s=S(p);
  $('#peek').innerHTML=`<button class="x glass" onclick="closePeek()">${ic('x',16)}</button>
   <div class="hero ph" style="--c:${s.c}">${p.imgs.length?`<img src="${iurl(p.imgs[0],1400)}" alt="" onerror="this.remove()">`:`<div class="none">${ic('ruler',28)}<span>No render yet</span></div>`}<div class="grad"></div>
     <div class="ttl"><div style="display:flex;gap:8px;margin-bottom:8px">${chipStage(p)}${tags(p)}</div><h2>${p.name}</h2><div style="font-size:14px;opacity:.9">${meta(p)}</div></div></div>
   <div class="bd">
     <div class="lbl" style="margin-bottom:8px">Journey</div>
     <div class="steps5" style="--c:${s.c}">${STEPS.map((n,i)=>`<div class="${s.step>=i?'f':''} ${s.step===i?'now':''}"><i></i>${n}${s.step===i?' · now':''}</div>`).join('')}</div>
     ${s.step<0?`<div class="chip slate" style="margin:-8px 0 16px">Closed as ${s.label}</div>`:''}
     ${p.next?`<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid ${p.next.k==='block'?'#fecdd3':p.next.k==='due'?'#fde68a':'var(--s200)'};background:${p.next.k==='block'?'#fff7f8':p.next.k==='due'?'#fffbeb':'var(--s50)'};margin-bottom:18px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px"><div class="lbl">Next step</div><div style="font-size:16px;font-weight:700">${p.next.t}</div><div class="help">Opens ${p.next.f} · designer ${p.own} · updated ${p.upd}</div></div>${nextBtn(p,false)}</div>`:''}
     <div class="lbl">Inside this project</div>
     <div class="fgrid">${FILES[p.stage].map(f=>`<div class="fcard" onclick="toast('Opens ${f[0]}')"><span class="ic">${ic('file',16)}</span><div><div style="font-weight:600;font-size:14px">${f[0]}</div><div class="help">${f[1]}</div></div></div>`).join('')}</div>
   </div>
   <div class="foot"><button class="btn p" onclick="toast('Opens the project')">Open project</button><button class="btn s" onclick="menu(event,${p.id})">Change stage</button><button class="btn s" onclick="toast('Cloned as template')">Clone as template</button></div>`;
  $('#peek').classList.add('on');$('#scrim').classList.add('on');
}
function closePeek(){$('#peek').classList.remove('on');$('#scrim').classList.remove('on')}

/* ··· menu (Open, files, Change stage, Clone as template, Select, Delete) */
function menu(e,id){
  closeMenu(); const p=P.find(x=>x.id===id);
  const m=document.createElement('div'); m.className='menu'; m.id='menu';
  m.innerHTML=`<button onclick="closeMenu();peek(${id})">Open</button>${FILES[p.stage].slice(0,3).map(f=>`<button onclick="closeMenu();toast('Opens ${f[0]}')">${f[0]}</button>`).join('')}<hr>
    <div class="lbl" style="padding:6px 10px 2px">Change stage</div>${ORDER.filter(k=>k!==p.stage).map(k=>`<button onclick="setStage(${id},'${k}')"><span class="sdot" style="background:${STAGE[k].c}"></span>${STAGE[k].label}</button>`).join('')}<hr>
    <button onclick="closeMenu();toast('Cloned as template')">Clone as template</button><button onclick="closeMenu();toast('Selected')">Select</button><button class="d" onclick="closeMenu();toast('Delete asks to confirm first')">Delete</button>`;
  document.body.appendChild(m);
  const r=e.target.getBoundingClientRect(); const mh=m.offsetHeight, mw=m.offsetWidth;
  m.style.left=Math.min(r.left,innerWidth-mw-10)+'px'; m.style.top=(r.bottom+mh+8>innerHeight?Math.max(10,r.top-mh-6):r.bottom+6)+'px';
  setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0);
}
function closeMenu(){const m=$('#menu');if(m)m.remove()}
function setStage(id,k){closeMenu();const p=P.find(x=>x.id===id);p.stage=k;toast(`${p.short} moved to ${STAGE[k].label}`);closePeek();render()}

/* ============ EVENTS ============ */
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){closePeek();closeMenu();return}
  if(/^[0-9]$/.test(e.key)){go(e.key==='0'?9:+e.key-1);return}
  if(st.v===4&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){cfMove(e.key==='ArrowRight'?1:-1);e.preventDefault()}
  if(st.v===7&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const n=list().filter(p=>p.next).length;st.spot=(st.spot+(e.key==='ArrowRight'?1:-1)+Math.min(n,4))%Math.max(Math.min(n,4),1);render()}
});
addEventListener('resize',()=>{if(st.v===4)cfLayout()});
render();
</script>
</body>
</html>
