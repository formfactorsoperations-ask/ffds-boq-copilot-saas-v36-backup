<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheStudioDesk · Clients — approved</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

/* StudioDesk tokens (DESIGN.md): Plus Jakarta Sans, brand #3D52A0, slate neutrals, rose/amber/emerald for state,
   stage colours approved for the Projects screen only (lib/projectFolders.ts). No amounts on this screen. */
:root{
  --brand:#3D52A0; --brandH:#334486; --brandT:rgba(61,82,160,.10);
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b; --s900:#0f172a;
  --rose:#e11d48; --rose7:#be123c; --rose1:#ffe4e6; --amber7:#b45309; --amber1:#fef3c7; --gold:#B8923A; --em7:#047857; --em1:#d1fae5;
  --lead:#0284c7; --proposal:#3D52A0; --won:#B8923A; --execution:#c2410c; --completed:#047857; --lost:#64748b; --terminated:#be123c;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:none} *::-webkit-scrollbar{display:none}
html,body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--s800);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:170px!important;background:
  radial-gradient(1200px 600px at 10% -10%,rgba(61,82,160,.10),transparent 60%),
  radial-gradient(900px 500px at 100% 0%,rgba(148,163,184,.18),transparent 60%),
  radial-gradient(circle at 1px 1px,rgba(100,116,139,.16) 1px,transparent 0) 0 0/22px 22px,#f5f7fb;min-height:100vh;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
.tnum{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--s500)}
.meta{font-size:12px;color:var(--s500)}
.help{font-size:11px;color:var(--s500)}

/* ---------- top bar (as the app) ---------- */
.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--s200);display:flex;align-items:center;gap:4px;padding:10px 22px;overflow-x:auto}
.logo{font-size:10px;font-weight:800;letter-spacing:.12em;border:1.5px solid var(--s700);padding:4px 8px;border-radius:6px;margin-right:14px;white-space:nowrap;color:var(--s700)}
.tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;font-weight:600;font-size:14px;color:var(--s700);white-space:nowrap}
.tab svg{color:var(--s400)}
.tab.on{background:linear-gradient(180deg,#4d62b4,var(--brand));color:#fff;box-shadow:0 6px 16px -6px rgba(61,82,160,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.tab.on svg{color:#fff}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--s500);flex:none}
.ib:hover{background:var(--s100)}
.who{display:flex;align-items:center;gap:10px;margin-left:8px;white-space:nowrap}
.who b{font-size:14px}
.sa{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--brand);background:var(--brandT);padding:3px 9px;border-radius:99px}
.av{width:36px;height:36px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}

.wrap{max-width:1380px;margin:0 auto;padding:22px 24px 0}
.title{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid rgba(203,213,225,.7);margin-bottom:14px}
.title h1{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--s800)}
.search{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--s300);background:#fff;min-width:240px;margin-left:auto}
.search input{border:0;outline:0;width:100%;font-size:14px;background:none}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,82,160,.18)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s,transform .15s,box-shadow .15s}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{background:var(--brandH)}
.btn.s{border:1px solid var(--s300);background:#fff;color:var(--s700)}.btn.s:hover{background:var(--s50)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn.block{background:var(--rose);color:#fff}.btn.block:hover{background:var(--rose7)}
.btn.due{background:var(--gold);color:#fff}.btn.due:hover{background:#a07d2e}
.btn.go{background:var(--brand);color:#fff}.btn.go:hover{background:var(--brandH)}
.btn:active{transform:translateY(1px)}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.strip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--s200);border-radius:16px;padding:7px 8px 7px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--s200);background:#fff;white-space:nowrap;transition:all .15s}
.bchip.r{color:var(--rose7);border-color:#fecdd3;background:#fff7f8}
.bchip.a{color:var(--amber7);border-color:#fde68a;background:#fffbeb}
.bchip.on{box-shadow:0 0 0 3px rgba(225,29,72,.15)}
.bchip.a.on{box-shadow:0 0 0 3px rgba(180,83,9,.15)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--s100);gap:2px}
.seg button{padding:5px 12px;border-radius:9px;font-size:12px;font-weight:700;color:var(--s500);transition:all .2s var(--ease)}
.seg button.on{background:#fff;color:var(--s800);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.stages{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;border-bottom:1px solid rgba(226,232,240,.7);margin-bottom:18px}
.stg{flex:none;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:12px;font-size:14px;font-weight:600;color:var(--s600);border:1px solid transparent;transition:all .2s var(--ease)}
.stg:hover{background:rgba(255,255,255,.8)}
.stg.on{background:#fff;border-color:var(--s200);color:var(--s800);box-shadow:0 4px 14px -6px rgba(15,23,42,.18)}
.stg i{width:10px;height:10px;border-radius:3px;display:block}
.stg .c{font-size:12px;color:var(--s400);font-weight:700}

/* ---------- shared pieces ---------- */
.panel{background:#fff;border:1px solid var(--s200);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.55));backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px -12px rgba(15,23,42,.25),inset 0 1px 0 rgba(255,255,255,.9)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chip.brand{background:var(--brandT);color:var(--brand)} .chip.slate{background:var(--s100);color:var(--s600)}
.chip.good{background:var(--em1);color:var(--em7)} .chip.warn{background:var(--amber1);color:var(--amber7)} .chip.bad{background:var(--rose1);color:var(--rose7)}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ph{position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.55),transparent 55%),
  linear-gradient(135deg,color-mix(in srgb,var(--c) 28%,#fff),color-mix(in srgb,var(--c) 55%,#e2e8f0))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),opacity .4s}
.ph .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:color-mix(in srgb,var(--c) 70%,#1e293b);font-size:11px;font-weight:700}
.ph .none svg{opacity:.7}
.own{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:var(--brand);flex:none;border:2px solid #fff}
.more{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--s500);flex:none}
.more:hover{background:var(--s100);color:var(--s800)}
.journey{display:flex;gap:3px;align-items:center}
.journey i{height:5px;flex:1;border-radius:9px;background:var(--s200);display:block}
.journey i.f{background:var(--c)}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 1px 2px rgba(15,23,42,.12),inset 0 1px 0 rgba(255,255,255,.8);background:linear-gradient(180deg,#fff,#f1f5f9);color:var(--brand)}
.tag.dummy{color:var(--amber7);background:linear-gradient(180deg,#fffbeb,#fef3c7)}
.tag.untagged{color:var(--rose7);background:linear-gradient(180deg,#fff1f2,#ffe4e6)}
.seal{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;transform:rotate(3deg);background:linear-gradient(180deg,#fff,#eef2ff);color:var(--s600);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.seal.pg{background:linear-gradient(180deg,#5a6fc0,var(--brand));color:#fff}
.empty{padding:48px;text-align:center}
.empty b{display:block;font-size:16px;color:var(--s800);margin-bottom:4px}

/* motion (mirrors hud-panel-in / hud-row-in / phd-pop; all off under reduced motion) */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.35)}50%{box-shadow:0 0 0 6px rgba(225,29,72,0)}}
@keyframes travel{from{background-position:0 0}to{background-position:-200px 0}}
.rise{animation:rise .45s var(--ease) both}
.swap{animation:fadein .25s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 1 · Ledger ---------- */
.lg-h{display:grid;grid-template-columns:minmax(300px,2.4fr) 1.2fr 1fr 1.3fr 40px;gap:16px;padding:12px 20px;border-bottom:1px solid var(--s100)}
.lg-grp{display:flex;align-items:center;gap:8px;padding:14px 20px 8px;font-size:12px;font-weight:700;color:var(--s600)}
.lg-r{display:grid;grid-template-columns:minmax(300px,2.4fr) 1.2fr 1fr 1.3fr 40px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--s100);cursor:pointer;transition:background .15s;position:relative}
.lg-r:hover{background:var(--s50)}
.lg-r .th{width:64px;height:48px;border-radius:12px;flex:none}
.lg-r:hover .th img{transform:scale(1.08)}
.lg-p{display:flex;gap:14px;align-items:center;min-width:0}
.lg-p .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files{display:flex;gap:6px;margin-top:6px;max-height:0;opacity:0;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s}
.lg-r:hover .files{max-height:40px;opacity:1}
.file{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--s700);background:#fff;border:1px solid var(--s200);border-radius:8px;padding:3px 8px;white-space:nowrap;transition:all .15s}
.file:hover{border-color:var(--brand);color:var(--brand)}
.file svg{color:var(--s400)}

/* ---------- 3 · Glass lanes ---------- */
.lanes{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;align-items:flex-start}
.lane{flex:0 0 268px;scroll-snap-align:start;border-radius:20px;padding:10px;min-height:420px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 10%,rgba(255,255,255,.6)),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(10px);transition:box-shadow .2s}
.lane.over{box-shadow:0 0 0 2px var(--c) inset}
.lane-h{display:flex;align-items:center;gap:8px;padding:6px 6px 12px;font-weight:700;font-size:14px}
.lane-h .c{margin-left:auto;font-size:12px;color:var(--s500);background:#fff;border-radius:99px;padding:1px 9px}
.lcard{background:#fff;border:1px solid var(--s200);border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:grab;transition:transform .2s var(--ease),box-shadow .2s}
.lcard:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(15,23,42,.25)}
.lcard.drag{opacity:.4}
.lcard .th{height:110px}
.lcard .b{padding:12px}

/* ---------- peek modal + menu + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,24,47,.4);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
.scrim.on{opacity:1;pointer-events:auto}
.peek{position:fixed;left:50%;top:50%;width:min(860px,94vw);max-height:90vh;overflow-y:auto;transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:201;background:#fff;border-radius:24px;border:1px solid var(--s200);box-shadow:0 40px 80px -20px rgba(15,23,42,.45)}
.peek.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.peek .hero{height:240px;border-radius:24px 24px 0 0}
.peek .hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(15,23,42,.65))}
.peek .hero .ttl{position:absolute;left:24px;bottom:20px;right:24px;color:#fff}
.peek .hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.peek .bd{padding:22px 24px}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 20px}
.steps5 div{font-size:11px;font-weight:700;color:var(--s400)}
.steps5 div i{display:block;height:6px;border-radius:9px;background:var(--s200);margin-bottom:6px}
.steps5 div.f i{background:var(--c)} .steps5 div.f{color:var(--s700)}
.steps5 div.now{color:var(--c)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.fcard{border:1px solid var(--s200);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:all .2s var(--ease)}
.fcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 18px -12px rgba(61,82,160,.5)}
.fcard .ic{width:36px;height:36px;border-radius:12px;background:var(--brandT);color:var(--brand);display:grid;place-items:center;flex:none}
.foot{display:flex;gap:8px;padding:14px 24px;background:var(--s50);border-top:1px solid var(--s100);border-radius:0 0 24px 24px;flex-wrap:wrap}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;z-index:3}
.menu{position:fixed;z-index:210;background:#fff;border:1px solid var(--s200);border-radius:14px;box-shadow:0 20px 40px -12px rgba(15,23,42,.3);padding:6px;min-width:200px;animation:pop .18s var(--ease)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--s700);text-align:left}
.menu button:hover{background:var(--s50)}
.menu button.d{color:var(--rose7)}
.menu hr{border:0;border-top:1px solid var(--s100);margin:4px 0}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,16px);opacity:0;background:var(--s800);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:all .25s var(--ease);z-index:300;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Recommended ---------- */
.rj{display:flex;align-items:center;padding:10px;overflow-x:auto;margin-bottom:14px}
.rj-s{flex:1;min-width:190px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-align:left;transition:all .25s var(--ease)}
.rj-s:hover{background:var(--s50)}
.rj-s.on{background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:inset 0 0 0 1.5px var(--c)}
.rj-ring{width:18px;height:18px;border-radius:50%;border:5px solid var(--c);background:#fff;flex:none;transition:transform .25s var(--ease)}
.rj-s.on .rj-ring{transform:scale(1.2)}
.rj-t{display:flex;flex-direction:column;min-width:0}
.rj-t b{font-size:14px;font-weight:700;white-space:nowrap}
.rj-toks{display:flex;margin-left:auto;padding-left:8px}
.rj-tok{width:28px;height:28px;border-radius:50%;overflow:hidden;margin-left:-9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--s200);flex:none}
.rj-tok .ph{width:100%;height:100%}
.rj-tok .ph .none span,.rj-tok .ph .none svg{display:none}
.rj-more{font-size:11px;font-weight:700;color:var(--s500);margin-left:4px;align-self:center}
.rj-line{width:22px;height:3px;border-radius:9px;background:linear-gradient(90deg,var(--s200),var(--s300));flex:none}
.rj-closed{flex:none;margin-left:10px;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:700;color:var(--s600);border:1px dashed var(--s300);white-space:nowrap}
.rj-closed.on{background:var(--s100);border-style:solid}
.rtool{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.rov{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-bottom:16px}
.rov .spot{margin-bottom:0;min-height:300px}
.rov .spot .th{min-height:300px}
.rneed{padding:18px;display:flex;flex-direction:column}
.rneed h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rneed h3 .n{margin-left:auto;font-size:24px;font-weight:900}
.rneed .sc{overflow-y:auto;max-height:262px;margin-top:6px}
.seg2{display:inline-flex;padding:4px;border-radius:12px;background:var(--s100);position:relative;margin-left:auto}
.seg2 button{position:relative;z-index:1;padding:6px 14px;border-radius:9px;font-size:12px;font-weight:700;color:var(--s500);display:flex;align-items:center;gap:6px;transition:color .2s}
.seg2 button.on{color:var(--s800)}
.seg2 .pill{position:absolute;top:4px;bottom:4px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.12);transition:left .35s var(--ease),width .35s var(--ease)}

/* ---------- 11 · Week planner ---------- */
.wk{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.wk-c{background:rgba(255,255,255,.65);border:1px solid var(--s200);border-radius:18px;padding:10px;min-height:420px;transition:box-shadow .2s}
.wk-c.today{background:#fff;box-shadow:inset 0 0 0 2px var(--brand)}
.wk-c.past{background:repeating-linear-gradient(135deg,rgba(241,245,249,.9) 0 8px,rgba(255,255,255,.7) 8px 16px)}
.wk-c.over{box-shadow:inset 0 0 0 2px var(--s400)}
.wk-h{display:flex;align-items:baseline;gap:8px;padding:4px 4px 12px}
.wk-h b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.wk-i{background:#fff;border:1px solid var(--s200);border-left:4px solid var(--k);border-radius:12px;padding:10px;margin-bottom:8px;cursor:grab;transition:transform .2s var(--ease),box-shadow .2s}
.wk-i:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px rgba(15,23,42,.35)}
.wk-i .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.wk-i .th{width:30px;height:30px;border-radius:9px;flex:none}
.wk-i .th .none span,.wk-i .th .none svg{display:none}

/* ---------- final screen ---------- */
.notebar{position:sticky;top:57px;z-index:55;display:flex;align-items:center;gap:10px;background:var(--s800);color:#e2e8f0;font-size:12px;padding:8px 24px}
.notebar b{color:#fff}
.notebar .sw{margin-left:auto;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.tg{width:34px;height:20px;border-radius:99px;background:rgba(255,255,255,.2);position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.tg.on{background:var(--brand)} .tg.on::after{transform:translateX(14px)}
.note{display:none;align-items:flex-start;gap:10px;margin:0 0 8px;padding:9px 12px;border-radius:12px;background:var(--s800);color:#e2e8f0;font-size:12px;line-height:1.5}

/* ---------- stickers: press on, peel on hover, explain themselves ---------- */
@property --p{syntax:'<length>';inherits:true;initial-value:4px}
.stkrow{display:inline-flex;gap:8px;align-items:center;vertical-align:middle;padding:2px 0}
.stk{--p:4px;position:relative;display:inline-flex;transform:rotate(var(--r));cursor:pointer;filter:drop-shadow(0 1px 1px rgba(15,23,42,.18));
  animation:stick .6s cubic-bezier(.34,1.56,.64,1) backwards .12s;transition:transform .3s cubic-bezier(.34,1.56,.64,1),filter .3s,--p .3s var(--ease)}
.stk.seal-w{animation-delay:.24s}
.stk>.tag,.stk>.seal{transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--p)),calc(100% - var(--p)) 100%,0 100%)}
.stk>.seal{border-radius:99px 99px 99px 99px}
.stk .fold{position:absolute;right:0;bottom:0;width:var(--p);height:var(--p);border-radius:0 0 3px 0;
  background:linear-gradient(315deg,transparent 50%,#e2e8f0 50%,#f8fafc 70%,#cbd5e1);box-shadow:-1px -1px 2px rgba(15,23,42,.18)}
.stk:hover{z-index:8;--p:10px;transform:rotate(calc(var(--r) * -0.6)) translateY(-2px) scale(1.06);filter:drop-shadow(0 6px 6px rgba(15,23,42,.22))}
.stk.slap{animation:slap .5s cubic-bezier(.34,1.56,.64,1)}
.stk::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(-4px) rotate(calc(var(--r) * -1));white-space:nowrap;
  background:var(--s800);color:#fff;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;padding:5px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:5;box-shadow:0 8px 18px -8px rgba(15,23,42,.5)}
.stk:hover::after{opacity:1;transform:translateY(-50%) translateX(0) rotate(calc(var(--r) * -1))}
@keyframes stick{0%{opacity:0;transform:translateY(-10px) scale(1.5) rotate(calc(var(--r) - 14deg));filter:drop-shadow(0 14px 10px rgba(15,23,42,.25))}
  55%{opacity:1;transform:scale(.92) rotate(calc(var(--r) + 2deg));filter:drop-shadow(0 1px 1px rgba(15,23,42,.18))}
  100%{opacity:1;transform:rotate(var(--r))}}
@keyframes slap{0%{transform:rotate(var(--r)) scale(1)}25%{transform:translateY(-8px) rotate(calc(var(--r) - 10deg)) scale(1.25)}60%{transform:rotate(calc(var(--r) + 2deg)) scale(.9)}100%{transform:rotate(var(--r)) scale(1)}}
.stk>.tag.untagged{animation:nudge 3.6s ease-in-out 1.4s infinite}
.stk:hover>.tag.untagged{animation-play-state:paused}
@keyframes nudge{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-8deg)}96%{transform:rotate(6deg)}}

/* ---------- journey strip in continuous motion ---------- */
@keyframes rjspin{to{transform:rotate(360deg)}}
@keyframes rjflow{to{-webkit-mask-position:16px 0;mask-position:16px 0}}
@keyframes rjcomet{0%{left:-6px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 2px);opacity:0}}
@keyframes rjbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rjhalo{0%{box-shadow:0 0 0 0 rgba(225,29,72,.45)}70%{box-shadow:0 0 0 9px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
@keyframes rjsheen{from{background-position:-200% 0}to{background-position:200% 0}}
.rj-ring{position:relative}
.rj-ring::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,var(--c) 0 22%,transparent 22% 100%);
  -webkit-mask:radial-gradient(circle,transparent 11px,#000 12px,#000 14px,transparent 15px);mask:radial-gradient(circle,transparent 11px,#000 12px,#000 14px,transparent 15px);
  animation:rjspin var(--sp,2.6s) linear infinite;opacity:.7}
.rj-s.blk .rj-ring{animation:rjhalo 1.8s ease-out infinite}
.rj-s.on{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:200% 100%;animation:rjsheen 3.2s linear infinite}
.rj-line{position:relative;width:46px;height:4px;border-radius:9px;flex:none;background:linear-gradient(90deg,var(--a),var(--b));
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 16px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 16px);
  -webkit-mask-size:16px 4px;mask-size:16px 4px;animation:rjflow .7s linear infinite;opacity:.75}
.rj-line i{position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--b);box-shadow:0 0 8px 2px color-mix(in srgb,var(--b) 60%,transparent);animation:rjcomet 1.8s cubic-bezier(.45,0,.55,1) infinite;animation-delay:var(--d)}
.rj-line{-webkit-mask:none;mask:none;background:none}
.rj-line::before{content:"";position:absolute;inset:0;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 16px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 16px);animation:rjflow .7s linear infinite;opacity:.7}
.rj-tok{animation:rjbob 2.8s ease-in-out infinite;transition:transform .45s var(--ease),opacity .45s,margin .45s var(--ease),width .45s var(--ease)}
.rj-toks .rj-tok:nth-child(n+4){display:none}
.rj-tok.leave{animation:none;opacity:0;transform:translateX(-10px) scale(.6);width:0;margin-left:0}
.rj-tok.enter{animation:rjin .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes rjin{from{opacity:0;transform:translateX(10px) scale(.5)}to{opacity:1;transform:none}}

.msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:10px}

.bub{max-width:68%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;position:relative;animation:pop .35s var(--ease) both;box-shadow:0 1px 1px rgba(15,23,42,.05)}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--s200);border-bottom-left-radius:5px}
.bub.us{align-self:flex-end;background:linear-gradient(180deg,#4d62b4,var(--brand));color:#fff;border-bottom-right-radius:5px}
.bub .t{display:block;font-size:10px;opacity:.65;margin-top:4px;text-align:right}
.bub.photo{padding:5px;width:240px}
.bub.photo .ph{height:150px;border-radius:12px}
.sysev{align-self:center;animation:pop .35s var(--ease) both}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--s200);border-radius:16px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--s400);animation:typing 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.cmp{padding:12px 16px 14px;background:#fff;border-top:1px solid var(--s100)}
.cmp .tpls{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.cmp .tpls button{flex:none;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;border:1px solid var(--s200);background:#fff;color:var(--s600);transition:all .15s}
.cmp .tpls button:hover,.cmp .tpls button.on{border-color:var(--brand);color:var(--brand);background:var(--brandT)}
.cmp .box{display:flex;gap:10px;align-items:flex-end}
.cmp textarea{flex:1;border:1px solid var(--s300);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.45;resize:none;height:64px;outline:0;font-family:inherit}
.cmp textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,82,160,.18)}
.cv-r{border-left:1px solid var(--s100);overflow-y:auto;background:#fff}
.cv-r .ph.big{height:150px}
.cv-r .sec{padding:14px 16px;border-top:1px solid var(--s100)}

/* ================= REPORTS · A · Year canvas ================= */
.yc{padding:22px 22px 18px;position:relative;overflow:hidden}
.yc-g{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:0;min-width:900px}
.ym{position:relative;padding:0 3px;min-width:0;cursor:pointer;border-radius:14px;transition:background .25s}
.ym:hover{background:rgba(61,82,160,.04)}
.ym.on{background:linear-gradient(180deg,rgba(61,82,160,.08),rgba(61,82,160,.02))}
.ym.fut{background:repeating-linear-gradient(135deg,rgba(241,245,249,.9) 0 7px,rgba(255,255,255,.4) 7px 14px)}
.ym .mn{text-align:center;font-size:12px;font-weight:800;color:var(--s500);padding:8px 0 6px;letter-spacing:.02em}
.ym.on .mn{color:var(--brand)}
.ym .cash{height:190px;display:flex;flex-direction:column-reverse;gap:3px;justify-content:flex-start;padding:0 6px}
.ym .cash .sg{border-radius:7px;overflow:hidden;position:relative;transform-origin:bottom;animation:drawv .7s var(--ease) both;min-height:6px}
.ym .cash .sg .ph{position:absolute;inset:0}
.ym .cash .sg:hover{outline:2px solid #fff;filter:brightness(1.08)}
.ym .ct{text-align:center;font-size:11px;font-weight:800;color:var(--s700);padding:6px 0 4px}
.ym .evs{min-height:86px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.ym .evs .stk{font-size:9px}
.ym .evs .tag{font-size:9px;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yc-pace{position:relative;height:110px;margin-top:6px}
.yc-pace svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scrub{position:absolute;top:0;bottom:0;width:calc(100% / 12);pointer-events:none;transition:left .45s var(--ease);z-index:4}
.scrub::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(180deg,var(--brand),rgba(61,82,160,.15))}
.scrub .knob{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--brand);border:3px solid #fff;box-shadow:0 0 0 2px var(--brand),0 6px 12px -4px rgba(61,82,160,.6)}
.nowm{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:#fff;background:var(--rose);padding:1px 6px;border-radius:99px;animation:breathe 2s infinite}
.mcard{display:grid;grid-template-columns:1.25fr 1fr;gap:0;overflow:hidden;border-radius:24px;margin-top:18px}
.mcard .l{padding:26px 28px}
.mcard .r{position:relative;min-height:320px}
.mcard .r .ph{position:absolute;inset:0}
.mcard .r .ph img{animation:kenburns 16s ease-in-out infinite alternate}
.mcard .r .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0) 45%,rgba(15,23,42,.7))}
.mcard .r .cap{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.mhead{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.nums{display:flex;gap:0;margin-top:20px;border-top:1px solid var(--s100)}
.nums div{flex:1;padding:14px 14px 0 0}
.nums div+div{padding-left:14px;border-left:1px solid var(--s100)}
.nums .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--s100)}
.todo .ph{width:44px;height:44px;border-radius:12px;flex:none}
.ytot{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px}
.ytot div{padding:18px 20px}
.ytot div+div{border-left:1px solid rgba(184,146,58,.35)}
.ytot .v{font-size:34px;font-weight:800;letter-spacing:-.03em}

/* ================= REPORTS · B · Goal room ================= */
.room{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.gring{padding:22px 20px 20px;text-align:center;position:relative;overflow:hidden}
.gring .rw{position:relative;width:230px;height:230px;margin:6px auto 10px}
.gring .rw svg{position:absolute;inset:0}
.gring .orbit{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--c) 0 14%,transparent 14% 100%);-webkit-mask:radial-gradient(circle,transparent 118px,#000 119px,#000 121px,transparent 122px);mask:radial-gradient(circle,transparent 118px,#000 119px,#000 121px,transparent 122px);animation:spin 5s linear infinite;opacity:.55}
.gring .ctr{position:absolute;inset:0;display:grid;place-items:center}
.gring .ctr .v{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.coins{display:flex;justify-content:center;flex-wrap:wrap;gap:0;margin-top:10px}
.coin{width:38px;height:38px;border-radius:50%;overflow:hidden;border:3px solid #fff;margin-left:-9px;box-shadow:0 4px 10px -4px rgba(15,23,42,.35);animation:pop .4s var(--ease) both;cursor:pointer;transition:transform .2s}
.coin:first-child{margin-left:0}
.coin:hover{transform:translateY(-4px);z-index:3}
.coin .ph{width:100%;height:100%}
.coin.maybe{opacity:.55;border-style:dashed;border-color:var(--brand)}
.lever{display:grid;grid-template-columns:1.2fr 1fr;gap:0;overflow:hidden;border-radius:24px;margin-top:18px}
.lever .l{padding:24px 26px}
.lever .r{padding:24px 26px;background:linear-gradient(160deg,#f6f7fc,#fff);border-left:1px solid var(--s100)}
.sl{margin-bottom:20px}
.sl input[type=range]{width:100%;accent-color:var(--brand);margin-top:8px}
.deal{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:1px solid var(--s200);background:#fff;cursor:pointer;transition:all .25s var(--ease);margin-bottom:10px}
.deal:hover{transform:translateY(-2px);box-shadow:0 12px 22px -16px rgba(15,23,42,.45)}
.deal.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandT)}
.deal .ph{width:56px;height:56px;border-radius:14px;flex:none}
.tank{position:relative;height:150px;border-radius:20px;overflow:hidden;background:#f1f5f9;border:1px solid var(--s200)}
.tank .liq{position:absolute;left:0;right:0;bottom:0;transition:height 1.4s var(--ease)}
.tank .liq svg{position:absolute;left:0;top:-10px;width:200%;height:14px;animation:wave 3.5s linear infinite}
.tank .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.srcs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end}
.src{display:flex;flex-direction:column;align-items:center;gap:6px}
.src .stack{display:flex;flex-direction:column-reverse;align-items:center;min-height:150px;justify-content:flex-start}
.src .stack .coin{margin:0 0 -12px 0}
.src .stack .dot0{width:30px;height:30px;border-radius:50%;border:2px dashed var(--s300);margin-bottom:-10px;background:#fff}

@media (max-width:980px){
  .side .sb{grid-template-columns:1fr}
  .cv{grid-template-columns:1fr;height:auto}
  .cv-l{max-height:300px}.cv-r{display:none}.cv-m{min-height:560px}
  .mcard,.lever,.room{grid-template-columns:1fr}
  .ytot{grid-template-columns:1fr 1fr}
  .srcs{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .wrap{padding:16px 14px 0}.top{padding:8px 12px}.who b,.sa{display:none}
  .dirbar{top:53px;padding:8px 12px}.dirbar .why{display:none}
  .hd .search{margin-left:0;width:100%;order:5;min-width:0}
  .pass{height:400px}
  .warm-track{height:170px}
  .pin{width:30px;height:30px}.pin .ph{border-width:2px}.pin .owe{width:14px;height:14px;font-size:8px}
  .warm-track .zone{font-size:9px}
  .mhead{font-size:24px}
  .ytot .v{font-size:26px}
  .gring .rw{width:200px;height:200px}
  .gring .orbit{-webkit-mask:radial-gradient(circle,transparent 103px,#000 104px,#000 106px,transparent 107px);mask:radial-gradient(circle,transparent 103px,#000 104px,#000 106px,transparent 107px)}
}
.mv{display:inline-flex;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px;background:var(--brandT);color:var(--brand)}

html,body{overflow-x:hidden}
/* ===== v5: conversations, derived ===== */
.derived{display:flex;gap:8px;align-items:center;padding:7px 18px;font-size:12px;color:var(--amber7);background:#fffbeb;border-bottom:1px solid #fde68a}
.evc{display:flex;gap:10px;align-items:flex-start;max-width:72%;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--s200);border-left:3px solid var(--s);animation:pop .35s var(--ease) both;font-size:13px}
.evc.them{align-self:flex-start}.evc.us{align-self:flex-end;background:#f6f7fc}
.evc .ei{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--s) 12%,#fff);color:var(--s)}
.srcc{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--s);background:color-mix(in srgb,var(--s) 10%,#fff);padding:2px 7px;border-radius:99px;white-space:nowrap}
.bub.logd{background:repeating-linear-gradient(135deg,#fff 0 8px,#fafafa 8px 16px);border:1.5px dashed var(--s300);display:flex;flex-direction:column}
.bub.logd .q{font-style:italic;color:var(--s700)}
.bub .tplc{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:2px 7px;border-radius:99px}
.logf{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--s50);border:1px solid var(--s200)}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--s200);background:#fff;white-space:nowrap;cursor:pointer}
.bchip.sel{border-color:var(--brand);color:var(--brand);background:var(--brandT)}
.inl{border:1px solid var(--s300);border-radius:10px;padding:8px 10px;font-size:13px;outline:0}
.inl:focus{border-color:var(--brand)}
/* ===== v5: reports KPIs ===== */
.pinrow{margin-bottom:16px}
.pin-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pins{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px}
.pk{flex:0 0 auto;min-width:170px;scroll-snap-align:start;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;align-items:center;gap:2px 8px;padding:10px 14px;border-radius:16px;background:#fff;border:1px solid var(--s200);text-align:left;transition:transform .2s var(--ease),box-shadow .2s}
.pk:hover{transform:translateY(-2px);box-shadow:0 12px 22px -16px rgba(15,23,42,.45)}
.pk .lbl{grid-column:1/3}
.pk .pv2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.pk .mini{grid-column:1/3;width:100%}
.vdot{width:9px;height:9px;border-radius:50%;background:transparent;flex:none}
.vdot.yes{background:var(--em7)}.vdot.watch{background:#d97706}.vdot.no{background:var(--rose);animation:breathe 2s infinite}
.lensbar{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--s100);overflow-x:auto;max-width:100%}
.lensbar button{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700;color:var(--s500);white-space:nowrap;transition:all .25s var(--ease)}
.lensbar button i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.lensbar button span{font-size:10px;color:var(--s400);background:#fff;border-radius:99px;padding:0 6px}
.lensbar button.on{background:#fff;color:var(--s800);box-shadow:0 1px 3px rgba(15,23,42,.12),inset 0 -2px 0 var(--c)}
.krow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:2px 2px 10px}
.kt{flex:0 0 260px;scroll-snap-align:start;padding:16px 16px 12px;border-radius:20px;background:#fff;border:1px solid var(--s200);border-top:3px solid var(--k);display:flex;flex-direction:column;gap:4px;transition:transform .25s var(--ease),box-shadow .25s}
.kt:hover{transform:translateY(-3px);box-shadow:0 18px 30px -22px rgba(15,23,42,.45)}
.kn{font-size:13px;font-weight:700;color:var(--s700);line-height:1.3}
.kv{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--s900)}
.kd{min-height:18px;font-size:12px}
.dl{font-weight:800;font-size:12px}
.kh{font-size:11px;color:var(--s400);line-height:1.4;margin-top:2px}
.pinb{font-size:16px;color:var(--s300);line-height:1;transition:transform .2s,color .2s}
.pinb:hover{transform:scale(1.2);color:var(--gold)}.pinb.on{color:var(--gold)}
.spk{display:block;margin-top:4px}
.ar2{display:flex;gap:6px}
.cash.dots{flex-direction:column-reverse;flex-wrap:wrap-reverse;align-content:center;justify-content:flex-start;gap:4px;align-items:center}
.cash.dots{display:flex;flex-direction:row;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center}
.dd{width:12px;height:12px;border-radius:50%;animation:pop .35s var(--ease) both}
.dd.ld{background:#bae6fd}.dd.pr{background:#3D52A0}
.dcoin{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 2px #B8923A;animation:pop .4s var(--ease) both}
.dcoin.big{width:38px;height:38px;box-shadow:0 0 0 2px #047857}
.dcoin.ghost{display:grid;place-items:center;font-weight:800;color:var(--s400);background:#fff;box-shadow:0 0 0 2px var(--s200);border-style:dashed}
.dcoin .ph{width:100%;height:100%}
.house{width:24px;height:24px;border-radius:8px;background:#fff6f1;color:#c2410c;display:grid;place-items:center;border:1px solid #fed7c3;animation:pop .35s var(--ease) both}
.cash.heat{display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.hcell{height:36px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;animation:pop .35s var(--ease) both}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;margin-top:6px}
.lgd i{display:inline-block;width:18px;height:3px;border-radius:9px;vertical-align:middle;margin-right:6px}
.sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sh-c{background:var(--s50);border:1px solid var(--s100);border-radius:16px;padding:12px}
.sh-r{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--s100);font-size:12px;cursor:pointer}
.sh-r:hover .kn2{color:var(--brand)}
.kn2{flex:1;color:var(--s600);font-weight:600}
@media (max-width:980px){.sheet{grid-template-columns:1fr 1fr}.evc{max-width:92%}}
@media (max-width:760px){.sheet{grid-template-columns:1fr}.kt{flex-basis:230px}}
.cv>*{min-width:0}
@media (max-width:760px){.cv-h .stkrow{display:none}.derived{padding:7px 12px}}
/* ===== v6: modal + client details ===== */
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(18,24,47,.42);backdrop-filter:blur(4px);overflow-y:auto}
.modal.on{display:flex;animation:fadein .2s ease}
.mbox{width:min(520px,100%);background:#fff;border-radius:24px;box-shadow:0 40px 80px -20px rgba(15,23,42,.45);border:1px solid var(--s200);overflow:hidden}
.mbox.wide{width:min(760px,100%)}
.mh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--s100)}
.mh .x{position:static;margin-left:auto}
.mb{padding:18px 22px}
.mf{display:flex;align-items:center;gap:8px;padding:14px 22px;background:var(--s50);border-top:1px solid var(--s100)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl .inl,.fl select{width:100%;padding:9px 11px;font-size:14px;border-radius:10px}
.fl .seg{align-self:flex-start}
.prow{display:grid;grid-template-columns:1.1fr 1.3fr 1fr 32px;gap:8px;margin-bottom:8px;animation:pop .25s var(--ease) both}
.prow .inl{width:100%;min-width:0}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--s200);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.opt:hover{border-color:var(--s300)}
.opt:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 3px var(--brandT)}
.opt.off{opacity:.5;cursor:not-allowed}
.opt.sm{padding:8px 12px;margin:0;font-size:13px;font-weight:600;gap:8px}
.opt input{accent-color:var(--brand)}
.warnb{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:var(--amber7);font-size:13px;margin-bottom:14px}
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pa{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--s200);background:#fff;text-align:left;font-size:13px;transition:all .2s var(--ease)}
.pa:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.tmp{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px;border-radius:14px;background:var(--s50);border:1px dashed var(--s300)}
.lnk{font-size:12px;font-weight:700;color:var(--brand)}
.lnk:hover{text-decoration:underline}
.dr{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;color:var(--s700);min-width:0}
.dr svg{color:var(--s400);flex:none}
.addc{color:var(--amber7);font-weight:700;font-size:12px}
/* ===== v6: reports ===== */
.rtabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--s100)}
.rtabs button{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;color:var(--s500);transition:all .25s var(--ease);white-space:nowrap}
.rtabs button.on{background:#fff;color:var(--s800);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.perbar{position:sticky;top:96px;z-index:40;margin:0 0 16px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid var(--s200);box-shadow:0 8px 20px -16px rgba(15,23,42,.35)}
.mpick{display:flex;align-items:center;gap:8px;padding:2px;border-radius:12px}
.mpick b{min-width:150px;text-align:center;font-size:14px}
.hero4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}

 const act=cum(g.monthly.map((v,i)=>i>NOW?null:(v||0)));const last=act[NOW];
 const step=(g.proj-last)/(11-NOW);const fc=MON.map((_,i)=>i<NOW?null:last+step*(i-NOW));const need=MON.map((_,i)=>i<NOW?null:last+(g.g-last)*(i-NOW)/(11-NOW));
 const pl=a=>a.map((v,i)=>v==null?null:`${X(i)},${Y(v)}`).filter(Boolean).join(' ');
 return `<div class="lgd mb8"><span><i style="background:${g.col}"></i>Actual</span><span><i style="background:none;border-top:2px dashed ${g.col}"></i>At this pace</span><span><i style="background:none;border-top:2px dashed #e11d48"></i>Path to the goal</span><span><i style="background:#B8923A"></i>Goal ${g.fmtv(g.g)}</span></div>
 <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:640px;display:block">
  ${[0,.25,.5,.75,1].map(f=>`<line x1="50" x2="${W-30}" y1="${Y(g.g*f)}" y2="${Y(g.g*f)}" stroke="#f1f5f9"/><text x="44" y="${Y(g.g*f)+4}" text-anchor="end" font-size="11" fill="#94a3b8">${HIDE&&g.money?'':g.fmtv(g.g*f)}</text>`).join('')}
  <line x1="50" x2="${W-30}" y1="${Y(g.g)}" y2="${Y(g.g)}" stroke="#B8923A" stroke-width="2"/>
  <rect x="${X(NOW)}" y="10" width="${X(11)-X(NOW)}" height="${H-40}" fill="url(#hatch)" opacity=".6"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e2e8f0" stroke-width="3"/></pattern></defs>
  <polygon points="${pl(act)} ${X(NOW)},${Y(0)} ${X(0)},${Y(0)}" fill="${g.col}" opacity=".08"/>
  <polyline points="${pl(act)}" fill="none" stroke="${g.col}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="1500" style="animation:dsh 1.4s ease forwards"/>
  <polyline points="${pl(fc)}" fill="none" stroke="${g.col}" stroke-width="3" stroke-dasharray="7 7" opacity=".7"/>
  <polyline points="${pl(need)}" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="4 6"/>
  ${act.map((v,i)=>v==null?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===NOW?6:3.5}" fill="${i===NOW?g.col:'#fff'}" stroke="${g.col}" stroke-width="2" data-tt="<b>${MON[i]}</b> · ${g.fmtv(v)} so far"/>`).join('')}
  <circle cx="${X(11)}" cy="${Y(g.proj)}" r="6" fill="#fff" stroke="${g.col}" stroke-width="3"/><text x="${X(11)}" y="${Y(g.proj)-12}" text-anchor="end" font-size="12" font-weight="800" fill="${g.col}">${g.fmtv(g.proj)}</text>
  ${MON.map((mn,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="${i===NOW?800:600}" fill="${i===NOW?'#1e293b':'#94a3b8'}">${mn}</text>`).join('')}
 </svg></div>
 <div class="row mt12" style="gap:10px;flex-wrap:wrap"><span class="chip ${g.proj>=g.g?'good':'warn'}" style="font-size:11px">${g.proj>=g.g?'On course':'Short by '+g.fmtv(g.g-g.proj)}</span><span class="help">To hit the goal you need ${g.fmtv(g.need)} a month from December, against ${g.fmtv(g.avg)} a month so far.</span></div>`;
}
function editGoals(){modal(`<div class="mh"><div><div class="lbl">Set targets</div><div class="h2">Founders’ goals · FY 26–27</div></div><button class="x" onclick="closeModal()">${ic('x',16)}</button></div>
 <div class="mb"><div class="fg">${[['sales','Sales booked (₹ lakh)'],['cash','Cash received (₹ lakh)'],['signed','Projects signed'],['leads','Leads']].map(([k,l])=>fld(l,'g_'+k,String(st.goals[k]),'','number')).join('')}</div><div class="help mt12">KPI targets (win rate, days to get paid, team load…) live here too in the real screen.</div></div>
 <div class="mf"><span class="sp" style="flex:1"></span><button class="btn s" onclick="closeModal()">Cancel</button><button class="btn p" onclick="['sales','cash','signed','leads'].forEach(k=>st.goals[k]=+$('#g_'+k).value||st.goals[k]);closeModal();toast('Goals saved');render(true)">Save goals</button></div>`)}

/* ============ ALL KPIs ============ */
function allK(el){
 const q=st.kq.toLowerCase();const idx=PI();
 const score=k=>{const v=pval(k,idx),t=tgtFor(k,idx);if(v==null||t==null||!k.dir)return 2;return k.dir==='up'?(v>=t?3:v>=t*.85?1:0):(v<=t?3:v<=t*1.15?1:0)};
 el.innerHTML=reportsHead()+perBar()+`<div class="row mb16" style="gap:10px;flex-wrap:wrap"><label class="search" style="margin:0;min-width:240px">${ic('search',16)}<input id="kq" placeholder="Find a KPI" value="${st.kq}"></label><div class="lensbar">${[['all','All','#334155'],...LENS].map(([k,l,c])=>`<button class="${(st.klens||'all')===k?'on':''}" style="--c:${c}" onclick="st.klens='${k}';render(true)"><i></i>${l}</button>`).join('')}</div><span class="sp"></span><button class="bchip ${st.koff?'sel':''}" onclick="st.koff=!st.koff;render(true)">Off target first</button></div>`+
 LENS.filter(([k])=>(st.klens||'all')==='all'||st.klens===k).map(([l,ln,c])=>{let ks=K.filter(k=>k.lens===l&&(!q||k.name.toLowerCase().includes(q)||k.how.toLowerCase().includes(q)));if(st.koff)ks.sort((a,b)=>score(a)-score(b));if(!ks.length)return '';
  return `<div class="row mt16 mb12"><span class="sdot" style="background:${c};width:10px;height:10px"></span><span class="h3">${ln}</span><span class="help">${ks.length}</span></div><div class="kgrid">${ks.map((k,i)=>kTile(k,i,c)).join('')}</div>`}).join('')||'<div class="panel" style="padding:40px;text-align:center"><b>No KPI matches</b></div>';
 const inp=$('#kq');inp.oninput=e=>{st.kq=e.target.value;const p=inp.selectionStart;render(true);const n=$('#kq');n.focus();n.setSelectionRange(p,p)};
}
VR[0]=el=>({overview,goals,kpis:allK})[st.rtab](el);
function toastFy(k){}
const pcoin=(p,i,maybe)=>`<span class="coin ${maybe?'maybe':''}" style="animation-delay:${i*60}ms" data-tt="${maybe?'If ':''}<b>${p.short}</b>${maybe?' signs':''} · ${p.client}${HIDE?'':' · '+Mr(p.v)}">${pph(p,100,'tiny')}</span>`;
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#modal').classList.contains('on')){closeModal();return}
 if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(e.key==='Escape')e.target.blur();return}
 if(st.scr==='reports'&&st.rtab!=='goals'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){st.ym=Math.max(0,Math.min(11,st.ym+(e.key==='ArrowRight'?1:-1)));render(true);return}
 if(e.key==='c'||e.key==='C'){goScr('clients');return}
 if(e.key==='r'||e.key==='R'){goScr('reports');return}
});
render();
</script>
